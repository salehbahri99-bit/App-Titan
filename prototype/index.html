<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Titan Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Reem+Kufi:wght@500;700&family=Cairo:wght@600;800&display=swap">
<style>/* Titan Pack design tokens — shared by the public site and the dashboard. */
:root{
  --bg:#F7F2E6; --surface:#FFFCF4; --surface-2:#EFE6D0; --ink:#1E2A2E; --muted:#56666A;
  --line:rgba(6,65,79,.16); --line-strong:rgba(6,65,79,.38);
  --primary:#06414F; --primary-ink:#06414F; --on-primary:#F4ECD5;
  --accent:#EF974F; --accent-ink:#B8621F; --charcoal:#3D3D3D; --cream:#F4ECD5;
  --success:#2F7D5B; --warning:#C98A1B; --error:#B83A2E;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:14px; --radius-sm:8px; --container:1240px; --gutter:clamp(16px,4vw,40px);
  --speed:1; --ease:cubic-bezier(.2,.7,.2,1);
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#02222A; --surface:#062F39; --surface-2:#0A3A45; --ink:#F4ECD5; --muted:#A7B7B4;
  --line:rgba(244,236,213,.12); --line-strong:rgba(244,236,213,.32);
  --primary:#0B5566; --primary-ink:#8CC6D0; --on-primary:#F4ECD5; --accent-ink:#F2A868;
  --logo-light:none; --logo-dark:block; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#02222A; --surface:#062F39; --surface-2:#0A3A45; --ink:#F4ECD5; --muted:#A7B7B4;
  --line:rgba(244,236,213,.12); --line-strong:rgba(244,236,213,.32);
  --primary:#0B5566; --primary-ink:#8CC6D0; --on-primary:#F4ECD5; --accent-ink:#F2A868;
  --logo-light:none; --logo-dark:block; color-scheme:dark;}

/* Layout concept: RTL editorial grid read like a press sheet — crop marks, crease (dashed) and cut (solid) rules, mm-annotated labels. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
.wrap{max-width:var(--container);margin-inline:auto;padding-inline:var(--gutter)}
.mono{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;direction:ltr;unicode-bidi:isolate}
.logo-l{display:var(--logo-light)} .logo-d{display:var(--logo-dark)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.6em;padding:.85em 1.4em;border-radius:calc(var(--radius) * .7);border:1.5px solid transparent;font-weight:600;text-decoration:none;cursor:pointer;transition:transform calc(.25s*var(--speed)) var(--ease),background calc(.25s*var(--speed)),color calc(.25s*var(--speed));font-size:.98rem;line-height:1.2;background:none}
.btn:hover{transform:translateY(-2px)}
.btn-accent{background:var(--accent);color:#2A1606}
.btn-accent:hover{background:#F5A866}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn .arr{transition:transform calc(.25s*var(--speed)) var(--ease)}
.btn:hover .arr{transform:translateX(-4px)}
[dir="ltr"] .btn .arr{transform:scaleX(-1)} [dir="ltr"] .btn:hover .arr{transform:scaleX(-1) translateX(-4px)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:24px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:40px;height:40px}
.brand b{font-family:var(--f-display);font-size:1.12rem;display:block;line-height:1.1}
.brand small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.24em;color:var(--muted);display:block;direction:ltr;text-align:start}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:.5em .8em;border-radius:8px;text-decoration:none;font-size:.93rem;color:var(--muted);transition:color .2s}
.nav a:hover{color:var(--ink)}
.hdr-tools{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-family:var(--f-mono);font-size:.72rem;font-weight:600}
.icon-btn:hover{border-color:var(--line-strong)}
.menu-btn{display:none}
@media (max-width:1060px){.nav{display:none}.menu-btn{display:grid}.hdr .btn-accent{display:none}.hdr-tools{margin-inline-start:auto}
  .nav.open{display:flex;flex-direction:column;position:absolute;top:100%;inset-inline:0;background:var(--surface);padding:12px var(--gutter) 20px;border-bottom:1px solid var(--line)}
  .nav.open a{padding:.8em 0;border-bottom:1px dashed var(--line);font-size:1.05rem;color:var(--ink)}}

/* section frame */
section{position:relative;padding-block:clamp(72px,10vw,128px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px 64px;align-items:end;margin-bottom:clamp(36px,5vw,64px)}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent-ink);margin-bottom:14px}
.eyebrow::before{content:"";width:28px;border-top:1.5px dashed currentColor}
.sec-head h2{font-size:clamp(2rem,4.2vw,3.4rem);letter-spacing:-.01em}
.sec-head p{color:var(--muted);max-width:56ch;font-size:1.05rem}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}
.sample{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border:1px dashed var(--line-strong);border-radius:99px;color:var(--muted);font-size:.72rem;margin-top:12px}
.crop{position:absolute;width:18px;height:18px;pointer-events:none;opacity:.55}
.crop::before,.crop::after{content:"";position:absolute;background:var(--ink)}
.crop::before{width:18px;height:1px;top:0}.crop::after{width:1px;height:18px;left:0}
.crop.tl{top:-9px;left:-9px}.crop.tr{top:-9px;right:-9px;transform:scaleX(-1)}.crop.bl{bottom:-9px;left:-9px;transform:scaleY(-1)}.crop.br{bottom:-9px;right:-9px;transform:scale(-1)}
.crease{border:0;border-top:1.5px dashed var(--line-strong);margin:0}

/* hero */
.hero{padding-block:clamp(40px,6vw,80px) clamp(64px,8vw,104px);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(2.3rem,5vw,4.4rem);font-weight:800;letter-spacing:-.015em;line-height:1.12}
.hero h1 em{font-style:normal;color:var(--accent-ink);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;inset-inline:0;bottom:.04em;border-bottom:3px dashed var(--accent);opacity:.7}
.hero-desc{font-size:clamp(1.02rem,1.4vw,1.2rem);color:var(--muted);max-width:52ch;margin-top:24px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.hero-specs{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:40px;padding-top:20px;border-top:1.5px dashed var(--line-strong)}
.hero-specs div{display:grid;gap:2px}
.hero-specs b{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.hero-specs span{font-size:.82rem;color:var(--muted)}
.stage{position:relative;aspect-ratio:1/1.02;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:visible}
.stage-inner{position:absolute;inset:0;border-radius:var(--radius);overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.stage-bar{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:3}
.seg{display:inline-flex;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:99px}
.seg button{white-space:nowrap;border:0;background:none;padding:.4em 1em;border-radius:99px;cursor:pointer;font-size:.82rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.stage-meta{color:var(--muted)}
.view{position:absolute;inset:56px 20px 56px;display:grid;place-items:center;transition:opacity calc(.5s*var(--speed)) var(--ease),transform calc(.6s*var(--speed)) var(--ease)}
.view[data-off]{opacity:0;transform:scale(.96);pointer-events:none}
.dieline{width:100%;height:100%;direction:ltr}
.dieline .cut{fill:none;stroke:var(--primary-ink);stroke-width:1.6;stroke-linejoin:round}
.dieline .crs{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-dasharray:6 5}
.dieline .dim{stroke:var(--muted);stroke-width:.8;fill:none}
.dieline text{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted);letter-spacing:.05em}
.dieline .panel-lbl{fill:var(--primary-ink);font-size:8px;opacity:.7}
.draw .cut{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw calc(2.6s*var(--speed)) var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.stage-foot{position:absolute;bottom:14px;inset-inline:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:3;flex-wrap:wrap}
.cmyk{display:flex;height:12px;border:1px solid var(--line)}
.cmyk i{width:18px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:.72rem}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:18px;border-top:1.6px solid var(--primary-ink)}
.legend i.d{border-top:1.6px dashed var(--accent)}
/* 3D box */
.scene{perspective:1100px;width:62%;aspect-ratio:1}
.box3d{--w:150px;--h:200px;--d:90px;position:relative;width:var(--w);height:var(--h);margin:auto;top:50%;transform-style:preserve-3d;transform:translateY(-50%) rotateX(-18deg) rotateY(-32deg);animation:spin calc(16s*var(--speed)) linear infinite}
@keyframes spin{to{transform:translateY(-50%) rotateX(-18deg) rotateY(328deg)}}
.face{position:absolute;left:50%;top:50%;backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.f-front,.f-back{width:var(--w);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--w)/-2)}
.f-left,.f-right{width:var(--d);height:var(--h);margin:calc(var(--h)/-2) 0 0 calc(var(--d)/-2)}
.f-top,.f-bottom{width:var(--w);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--w)/-2)}
.f-front{transform:translateZ(calc(var(--d)/2));background:var(--primary)}
.f-back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));background:#053845}
.f-right{transform:rotateY(90deg) translateZ(calc(var(--w)/2));background:#EF974F}
.f-left{transform:rotateY(-90deg) translateZ(calc(var(--w)/2));background:#D9823D}
.f-top{transform:rotateX(90deg) translateZ(calc(var(--h)/2));background:#F4ECD5}
.f-bottom{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));background:#cdbf9d}
.f-front img{width:52%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.1))}
.f-front .tag{position:absolute;bottom:14px;font-family:var(--f-mono);font-size:8px;letter-spacing:.2em;color:#F4ECD5}
.f-right .v{writing-mode:vertical-rl;font-family:var(--f-display);color:#2A1606;font-size:12px;font-weight:700;letter-spacing:.14em}
.f-back .tag{font-family:var(--f-mono);font-size:7px;color:#F4ECD5;opacity:.7;letter-spacing:.2em}
.f-top{background-image:repeating-linear-gradient(90deg,transparent 0 10px,rgba(6,65,79,.08) 10px 11px)}
.floor{position:absolute;width:60%;height:24px;left:20%;bottom:6%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);filter:blur(2px)}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.stage{max-width:520px;width:100%;margin-inline:auto}}
@media (max-width:560px){.stage-meta{display:none}.tc-fab{padding:10px}.tc-fab span{display:none}}
@media (max-width:480px){.box3d{--w:110px;--h:150px;--d:66px}.legend{display:none}}

/* intro */
.intro .wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px 80px}
.intro-lead{font-family:var(--f-display);font-size:clamp(1.5rem,2.8vw,2.3rem);line-height:1.45;font-weight:500}
.intro-lead mark{background:none;color:var(--accent-ink)}
.pillars{display:grid;gap:0;border-top:1.5px dashed var(--line-strong)}
.pillar{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:18px 0;border-bottom:1.5px dashed var(--line-strong)}
.pillar .mono{color:var(--accent-ink);padding-top:5px}
.pillar h3{font-size:1.1rem}
.pillar p{grid-column:2;color:var(--muted);font-size:.95rem}
@media (max-width:820px){.intro .wrap{grid-template-columns:1fr}}

/* team */
.team{background:var(--primary);color:var(--on-primary)}
.team .sec-head p{color:color-mix(in srgb,var(--on-primary) 72%,transparent)}
.team .eyebrow{color:var(--accent)}
.team-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:rgba(244,236,213,.16);border:1px solid rgba(244,236,213,.16);border-radius:var(--radius);overflow:hidden}
.member{background:var(--primary);padding:28px 22px 26px;display:flex;flex-direction:column;gap:14px;min-height:340px;transition:background calc(.3s*var(--speed))}
.member:hover{background:color-mix(in srgb,var(--primary) 82%,#000)}
.member .num{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1;color:transparent;-webkit-text-stroke:1.2px var(--accent)}
.member .ico{width:46px;height:46px;border-radius:12px;background:rgba(244,236,213,.08);display:grid;place-items:center;color:var(--accent)}
.member h3{font-size:1.12rem;color:var(--on-primary)}
.member .en{opacity:.6;color:var(--on-primary)}
.member p{font-size:.9rem;color:color-mix(in srgb,var(--on-primary) 74%,transparent);line-height:1.7}
.member ul{list-style:none;padding:0;margin:auto 0 0;display:flex;flex-wrap:wrap;gap:6px}
.member li{font-size:.72rem;padding:3px 9px;border-radius:99px;border:1px solid rgba(244,236,213,.22);color:var(--on-primary)}
@media (max-width:1100px){.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.member:last-child{grid-column:1/-1}.member{min-height:0}}
@media (max-width:560px){.team-grid{grid-template-columns:1fr}}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.svc{padding:28px 24px 30px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:12px;position:relative;transition:background calc(.3s*var(--speed));min-width:0}
.svc:hover{background:var(--surface)}
.svc .ico{color:var(--primary-ink);width:44px;height:44px}
.svc .k{position:absolute;top:22px;inset-inline-end:22px;color:var(--muted)}
.svc h3{font-size:1.18rem}
.svc p{color:var(--muted);font-size:.93rem}
.svc ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:4px;font-size:.85rem;color:var(--ink)}
.svc li::before{content:"— ";color:var(--accent-ink)}
@media (max-width:1000px){.svc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.svc-grid{grid-template-columns:1fr}}

/* art tile (generated packaging render) */
.art{position:relative;display:block;width:100%;overflow:hidden;border-radius:var(--radius)}
.art svg{direction:ltr;display:block;width:100%;height:100%;transition:transform calc(.7s*var(--speed)) var(--ease)}

/* featured */
.feat-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.feat{grid-column:span 6;cursor:pointer;display:flex;flex-direction:column;gap:14px;background:none;border:0;padding:0;text-align:start}
.feat.big{grid-column:span 12;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:end}
.feat .art{aspect-ratio:4/3}
.feat.big .art{aspect-ratio:16/10}
.feat:hover .art svg{transform:scale(1.035)}
.feat-meta{display:flex;flex-direction:column;gap:8px}
.feat-meta .row{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.feat h3{font-size:clamp(1.3rem,2.2vw,1.9rem)}
.feat.big h3{font-size:clamp(1.7rem,3.2vw,2.8rem)}
.feat p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
@media (max-width:820px){.feat,.feat.big{grid-column:span 12;grid-template-columns:1fr}}

/* gallery */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:.5em 1.05em;border-radius:99px;cursor:pointer;font-size:.88rem;color:var(--muted);transition:all .2s}
.filters button:hover{color:var(--ink);border-color:var(--line-strong)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters sup{font-family:var(--f-mono);font-size:.62rem;margin-inline-start:4px;opacity:.7}
.masonry{columns:3 280px;column-gap:18px}
.g-item{break-inside:avoid;margin-bottom:18px;display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;text-align:start;position:relative;animation:pop calc(.45s*var(--speed)) var(--ease) both}
@keyframes pop{from{opacity:.2;transform:translateY(10px)}}
.g-item .art{border-radius:var(--radius)}
.g-cap{position:absolute;inset-inline:10px;bottom:10px;padding:10px 14px;border-radius:calc(var(--radius) * .7);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(6px);display:flex;justify-content:space-between;align-items:center;gap:10px;transform:translateY(6px);opacity:.0;transition:all calc(.3s*var(--speed)) var(--ease)}
.g-item:hover .g-cap,.g-item:focus-visible .g-cap{opacity:1;transform:none}
.g-cap b{font-family:var(--f-display);font-size:.98rem}
.g-cap .mono{color:var(--muted);font-size:.64rem}
@media (hover:none){.g-cap{opacity:1;transform:none}}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(2,20,25,.86);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.lb-card{background:var(--surface);color:var(--ink);border-radius:var(--radius);width:min(1100px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.lb-card .art{border-radius:0;height:100%;min-height:320px}
.lb-info{padding:32px;display:flex;flex-direction:column;gap:16px}
.lb-info h3{font-size:1.9rem}
.lb-info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:.92rem;border-top:1.5px dashed var(--line-strong);padding-top:16px}
.lb-info dt{color:var(--muted)}
.lb-info dd{margin:0}
.lb-nav{display:flex;gap:8px;margin-top:auto}
.lb-close{position:absolute;top:18px;inset-inline-end:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--cream);color:#06414F;font-size:1.3rem;cursor:pointer}
@media (max-width:760px){.lb-card{grid-template-columns:1fr}.lb-card .art{min-height:0;aspect-ratio:4/3}}

/* process */
.proc-track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative;margin-bottom:28px}
.proc-track::before{content:"";position:absolute;top:22px;inset-inline:8%;border-top:1.5px dashed var(--line-strong)}
.proc-fill{position:absolute;top:21px;inset-inline-start:8%;height:3px;background:var(--accent);border-radius:3px;transition:width calc(.5s*var(--speed)) var(--ease)}
.step{position:relative;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 4px;color:var(--muted)}

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return"#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
let artUid=0;
function boxArt(p,W=400,H=300,opt={}){
 if(p.coverUrl)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${tpEsc(opt.alt||p.lbl)}"><image href="${p.coverUrl}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/></svg>`;
 const [w,d,h]=SHAPES[p.shape]; const c=.866;
 const P=(x,y,z)=>[(x-z)*c,(x+z)*.5-y];
 const V=[P(0,0,d),P(w,0,d),P(w,0,0),P(0,h,0),P(w,h,0),P(w,h,d),P(0,h,d)];
 const xs=V.map(v=>v[0]),ys=V.map(v=>v[1]);
 const bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
 const s=Math.min(W*.56/bw,H*.64/bh); const ox=W/2-(Math.min(...xs)+bw/2)*s, oy=H*.5-(Math.min(...ys)+bh/2)*s+H*.02;
 const Q=(x,y,z)=>{const q=P(x,y,z);return[(q[0]*s+ox).toFixed(1),(q[1]*s+oy).toFixed(1)]};
 const poly=a=>a.map(q=>q.join(",")).join(" ");
 const A=[Q(0,0,d),Q(w,0,d),Q(w,h,d),Q(0,h,d)], B=[Q(w,0,0),Q(w,0,d),Q(w,h,d),Q(w,h,0)], T=[Q(0,h,0),Q(w,h,0),Q(w,h,d),Q(0,h,d)];
 const mA=`matrix(${(c*s).toFixed(3)},${(.5*s).toFixed(3)},0,${s.toFixed(3)},${Q(0,h,d).join(",")})`;
 const mB=`matrix(${(c*s).toFixed(3)},${(-.5*s).toFixed(3)},0,${s.toFixed(3)},${Q(w,h,d).join(",")})`;
 const mT=`matrix(${(c*s).toFixed(3)},${(.5*s).toFixed(3)},${(-c*s).toFixed(3)},${(.5*s).toFixed(3)},${Q(0,h,0).join(",")})`;
 const id="a"+(++artUid);
 // artwork on the front face (local units: u 0..w, v 0..h)
 const fw=w,fh=h,fs=Math.min(fw,fh);
 let art="";
 const lbl=`<text x="${fw/2}" y="${fh*.56}" text-anchor="middle" font-family="Alexandria,sans-serif" font-weight="800" font-size="${(fs*.17).toFixed(3)}" letter-spacing="${(fs*.012).toFixed(3)}" fill="${p.c3}">${tpEsc(p.lbl)}</text>`;
 const sub=`<text x="${fw/2}" y="${fh*.56+fs*.12}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${(fs*.055).toFixed(3)}" letter-spacing="${(fs*.01).toFixed(3)}" fill="${p.c3}" opacity=".75">${tpEsc(p.sub||"EST. 2026")}</text>`;
 switch(p.pat){
  case"band":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><rect y="${fh*.36}" width="${fw}" height="${fh*.34}" fill="${p.c2}"/>${lbl.replace(p.c3,p.c1)}${sub.replace(p.c3,p.c1)}<circle cx="${fw/2}" cy="${fh*.2}" r="${fs*.07}" fill="none" stroke="${p.c2}" stroke-width="${fs*.012}"/>`;break;
  case"arc":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><circle cx="${fw/2}" cy="${fh*1.02}" r="${fw*.62}" fill="${p.c2}"/><circle cx="${fw*.5}" cy="${fh*.24}" r="${fs*.05}" fill="${p.c2}"/>${lbl}${sub}`;break;
  case"frame":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><rect x="${fs*.07}" y="${fs*.07}" width="${fw-fs*.14}" height="${fh-fs*.14}" fill="none" stroke="${p.c2}" stroke-width="${fs*.012}"/><rect x="${fs*.1}" y="${fs*.1}" width="${fw-fs*.2}" height="${fh-fs*.2}" fill="none" stroke="${p.c2}" stroke-width="${fs*.004}"/>${lbl}${sub}`;break;
  case"split":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><path d="M0 ${fh*.62} L${fw} ${fh*.3} L${fw} ${fh} L0 ${fh}Z" fill="${p.c2}"/><rect x="${fw*.08}" y="${fh*.1}" width="${fs*.14}" height="${fs*.14}" fill="${p.c2}"/><rect x="${fw*.08+fs*.045}" y="${fh*.1+fs*.018}" width="${fs*.05}" height="${fs*.104}" fill="${p.c1}"/><rect x="${fw*.08+fs*.018}" y="${fh*.1+fs*.045}" width="${fs*.104}" height="${fs*.05}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.4}"`).replace(`text-anchor="middle"`,`text-anchor="start"`).replace(`x="${fw/2}"`,`x="${fw*.08}"`)}`;break;
  case"dots":{let dots="";for(let i=0;i<7;i++)for(let j=0;j<11;j++)dots+=`<circle cx="${(i+.5)*fw/7}" cy="${(j+.5)*fh/11}" r="${fs*.018}" fill="${p.c2}" opacity=".55"/>`;art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/>${dots}<rect x="${fw*.12}" y="${fh*.4}" width="${fw*.76}" height="${fs*.3}" rx="${fs*.03}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.4+fs*.2}"`)}`;break}
  case"stripes":{let st="";for(let i=0;i<10;i+=2)st+=`<rect x="${i*fw/10}" width="${fw/10}" height="${fh}" fill="${p.c2}"/>`;art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/>${st}<ellipse cx="${fw/2}" cy="${fh/2}" rx="${fw*.3}" ry="${fh*.34}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.56}"`).replace(/fill="[^"]+">/,`fill="${p.c3}">`)}`;break}
  case"kraft":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><circle cx="${fw/2}" cy="${fh/2}" r="${fs*.26}" fill="none" stroke="${p.c2}" stroke-width="${fs*.02}"/><circle cx="${fw/2}" cy="${fh/2}" r="${fs*.21}" fill="none" stroke="${p.c2}" stroke-width="${fs*.006}" stroke-dasharray="${fs*.02} ${fs*.015}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh/2+fs*.05}"`).replace(/fill="[^"]+">/,`fill="${p.c2}">`).replace(/font-size="[^"]+"/,`font-size="${(fs*.11).toFixed(3)}"`)}`;break;
  default:art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><text x="${fw/2}" y="${fh*.52}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${fs*.12}" fill="${p.c3}">${tpEsc(p.lbl)}</text><rect x="${fw*.3}" y="${fh*.6}" width="${fw*.4}" height="${fs*.03}" fill="${p.c3}" opacity=".5"/>`;
 }
 const side=p.pat==="kraft"?`<rect width="${d}" height="${h}" fill="${p.c1}"/><rect y="${h*.8}" width="${d}" height="${h*.2}" fill="${p.c2}" opacity=".85"/>`:
   `<rect width="${d}" height="${h}" fill="${p.pat==="band"||p.pat==="arc"?p.c2:p.c1}"/><text x="${d/2}" y="${h/2}" text-anchor="middle" transform="rotate(90 ${d/2} ${h/2})" font-family="IBM Plex Mono,monospace" font-size="${Math.min(d,h)*.09}" letter-spacing="${Math.min(d,h)*.02}" fill="${p.pat==="band"||p.pat==="arc"?p.c1:p.c2}">${tpEsc(p.lbl)}</text>`;
 const top=`<rect width="${w}" height="${d}" fill="${p.pat==="frame"?p.c1:shade(p.c1,.08)}"/>${p.pat==="frame"?`<rect x="${Math.min(w,d)*.08}" y="${Math.min(w,d)*.08}" width="${w-Math.min(w,d)*.16}" height="${d-Math.min(w,d)*.16}" fill="none" stroke="${p.c2}" stroke-width="${Math.min(w,d)*.01}"/>`:""}`;
 const grid=opt.grid===false?"":`<pattern id="${id}g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="${shade(p.bg,-.1)}" stroke-width=".6"/></pattern><rect width="${W}" height="${H}" fill="url(#${id}g)" opacity=".7"/>`;
 const floor=Q(w/2,0,d/2);
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${tpEsc(opt.alt||p.lbl)}"><defs><clipPath id="${id}a"><rect width="${w}" height="${h}"/></clipPath><clipPath id="${id}b"><rect width="${d}" height="${h}"/></clipPath><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs>
 <rect width="${W}" height="${H}" fill="${p.bg}"/>${grid}
 <ellipse cx="${floor[0]}" cy="${(+floor[1]+s*.06).toFixed(1)}" rx="${(s*(w+d)*.62).toFixed(1)}" ry="${(s*(w+d)*.16).toFixed(1)}" fill="#000" opacity=".16" style="filter:blur(6px)"/>

 const params=new URLSearchParams(location.search);
 const mode=params.get("preview")||"live";
 function keyFor(m){return m==="draft"?K.draft:m==="work"?K.work:K.live}
 function read(m=mode){
  if(/^v\d+$/.test(m)){const v=(get(K.versions)||[]).find(x=>"v"+x.v===m);return v?v.snapshot:null}
  return get(keyFor(m))||(m==="work"?get(K.draft)||get(K.live):m==="draft"?get(K.live):null);
 }
 const media=()=>get(K.media)||{};
 const mediaUrl=id=>{const r=id&&media()[id];return r?r.data||r.url||null:null};

 /* overlay a payload on the shared globals (CONTENT, CATS, PROJECTS, PROJ_META) — mutates in place */
 function apply(p){
  p=p||BASE;
  for(const l of ["ar","en"]){const t=CONTENT[l];for(const k of Object.keys(t))delete t[k];Object.assign(t,clone(p.content[l]||BASE.content[l]))}
  CATS.splice(0,CATS.length,...p.cats);
  const M=media();
  // services: drop hidden ones and remap project→service indexes to match
  const svcMap={};let n=0;(p.services||[]).forEach((s,i)=>{if(s.visible!==false)svcMap[i]=n++});
  for(const l of ["ar","en"]){const C=CONTENT[l];
   C.services.items=C.services.items.filter((_,i)=>svcMap[i]!==undefined);
   C.team.members=C.team.members.filter((_,i)=>(p.team||[])[i]?.visible!==false);
   C.tst.items=C.tst.items.filter((_,i)=>(p.tst||[])[i]?.visible!==false);
  }
  const live=p.projects.filter(x=>x.status==="published");
  PROJECTS.splice(0,PROJECTS.length,...live.map(x=>({...x,featured:x.featured?1:0,coverUrl:x.cover&&M[x.cover]?M[x.cover].data:null})));
  for(const k of Object.keys(PROJ_META))delete PROJ_META[k];
  live.forEach(x=>{
   PROJ_META[x.id]={...x.meta,svc:(x.meta.svc||[]).filter(i=>svcMap[i]!==undefined).map(i=>svcMap[i])};
   for(const l of ["ar","en"]){const pr=CONTENT[l].proj;if(!pr[x.id])pr[x.id]=[x.lbl,"",""]}
  });
  return p;
 }

 /* theme tokens the site's own customizer doesn't cover → one <style> block (light palette only; dark keeps its own) */
 const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return`rgba(${n>>16},${n>>8&255},${n&255},${a})`};
 function themeCSS(t){
  const d=THEME_DEF,v=[],x=[];
  const c=(k,css)=>{if(t[k]&&t[k]!==d[k])v.push(css)};
  c("bg",`--bg:${t.bg}`);c("surface",`--surface:${t.surface}`);c("secondary",`--surface-2:${t.secondary}`);c("ink",`--ink:${t.ink}`);c("muted",`--muted:${t.muted}`);
  if(t.border&&t.border!==d.border)v.push(`--line:${hexA(t.border,.16)};--line-strong:${hexA(t.border,.38)}`);
  c("success",`--success:${t.success}`);c("warning",`--warning:${t.warning}`);c("error",`--error:${t.error}`);
  const g=[];
  if(t.bodyFont&&t.bodyFont!==d.bodyFont)g.push(`--f-body:"${t.bodyFont}","IBM Plex Sans Arabic",system-ui,sans-serif`);
  if(+t.container&&+t.container!==d.container)g.push(`--container:${+t.container}px`);
  if(t.speed!=null&&+t.speed!==d.speed)g.push(`--speed:${+t.speed}`);
  if(t.ease==="snappy")g.push(`--ease:cubic-bezier(.4,0,.2,1)`);else if(t.ease==="soft")g.push(`--ease:cubic-bezier(.16,1,.3,1)`);
  if(v.length)x.push(`:root{${v.join(";")}}`);
  if(g.length)x.push(`:root{${g.join(";")}}`);
  if(+t.baseSize&&+t.baseSize!==d.baseSize||+t.lineHeight&&+t.lineHeight!==d.lineHeight)x.push(`body{font-size:${+t.baseSize}px;line-height:${+t.lineHeight}}`);
  if(+t.headWeight!==d.headWeight||+t.tracking!==d.tracking)x.push(`h1,h2,h3,h4{font-weight:${+t.headWeight};letter-spacing:${(+t.tracking/100).toFixed(3)}em}`);
  if(t.btn==="pill")x.push(`.btn{border-radius:999px}`);else if(t.btn==="square")x.push(`.btn{border-radius:2px}`);
  return x.join("\n");
 }
 function injectTheme(t,doc=document){
  let s=doc.getElementById("tp-cms-theme");
  if(!s){s=doc.createElement("style");s.id="tp-cms-theme";doc.head.appendChild(s)}
  s.textContent=themeCSS(t);
 }

 /* ---------- Supabase: used when config.js names a project; otherwise everything stays in this browser ---------- */
 const CFG=typeof TP_CONFIG!=="undefined"?TP_CONFIG:{};
 const remote=!!(CFG.supabaseUrl&&CFG.supabaseAnonKey);
 let sb=null,sbLoading=null;
 function client(){
  if(sb)return Promise.resolve(sb);
  return sbLoading=sbLoading||new Promise((res,rej)=>{
   const make=()=>res(sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,detectSessionInUrl:true}}));
   if(window.supabase)return make();
   const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";
   s.onload=make;s.onerror=()=>rej(new Error("supabase_unavailable"));document.head.appendChild(s);
  });
 }
 const toMedia=r=>({id:r.id,name:r.name,title:r.title,kind:r.kind,ext:r.ext,size:+r.size,optSize:r.opt_size?+r.opt_size:null,w:r.w,h:r.h,folder:r.folder,path:r.path,url:r.url,data:r.kind==="image"?r.url:null,clip:r.clip,at:+new Date(r.created_at),by:r.author});
 async function pullMedia(c){const {data,error}=await c.from("media").select("*");if(error)throw error;const m={};data.forEach(r=>m[r.id]=toMedia(r));cache(K.media,m);return m}
 async function slot(c,s){const {data,error}=await c.from("site_state").select("payload").eq("slot",s).maybeSingle();if(error)throw error;return data&&data.payload}
 async function hydrateSite(){
  if(mode==="work")return read("work");                      // the dashboard's own working copy, already local
  const c=await client();let p=null;
  if(/^v\d+$/.test(mode)){const {data}=await c.from("versions").select("payload").eq("v",+mode.slice(1)).maybeSingle();p=data&&data.payload}
  else if(mode==="draft")p=await slot(c,"draft").catch(()=>null);
  if(!p)p=await slot(c,"live");
  await pullMedia(c).catch(()=>{});
  return p;
 }

 /* contact form → dashboard inbox. Returns {ok} or {ok:false,error:"rate"|"fail"} */
 async function addLead(l){
  const files=(l.files||[]).map(f=>({name:f.name,size:f.size,file:f.file}));
  if(!remote){const a=get(K.leads)||[];a.unshift({id:"L"+Date.now().toString(36),at:new Date().toISOString(),status:"new",...l,files:files.map(({name,size})=>({name,size}))});put(K.leads,a.slice(0,200));return{ok:true}}
  try{
   const c=await client(),id=crypto.randomUUID(),stored=[];
   for(const f of files){if(!f.file)continue;const path=`incoming/${id}/${Date.now().toString(36)}-${f.name.replace(/[^\w.\-]+/g,"_").slice(-80)}`;
    const {error}=await c.storage.from("lead-files").upload(path,f.file,{upsert:false,contentType:f.file.type||"application/octet-stream"});if(error)throw error;stored.push({name:f.name,size:f.size,path})}
   const {error}=await c.from("leads").insert({id,name:l.name,company:l.company||null,email:l.email,phone:l.phone||null,type:l.type||null,budget:l.budget||null,msg:l.msg,lang:l.lang==="en"?"en":"ar",files:stored});
   if(error)throw error;return{ok:true};
  }catch(e){return{ok:false,error:/rate_limited/.test(e&&e.message||"")?"rate":"fail"}}
 }

 const api={K,SECTIONS,THEME_DEF,BASE,clone,get,put,cache,hooks,read,apply,media,mediaUrl,themeCSS,injectTheme,addLead,mode,preview:mode!=="live",payload:null,remote,client,toMedia,pullMedia};
 if(!remote){api.payload=mode==="live"&&!get(K.live)?null:read();if(api.payload)apply(api.payload);api.ready=Promise.resolve(api.payload)}
 else api.ready=hydrateSite().catch(e=>{console.warn("Titan Pack: content service unavailable",e);return null}).then(p=>{api.payload=p;if(p)apply(p);return p});
 return api;
})();

 <path class="crs" d="${crs}"/><path class="cut" d="${cut}"/>

 <path class="dim" d="M${X(72)},22V32 M${X(168)},22V32 M${X(72)},27H${X(168)} M${X(168)},22V32 M${X(216)},22V32 M${X(168)},27H${X(216)}"/>
 <text x="${X(120)}" y="20" text-anchor="middle">60</text><text x="${X(192)}" y="20" text-anchor="middle">30</text>
 <path class="dim" d="M372,${y1}H382 M372,${y2}H382 M377,${y1}V${y2}"/>
 <text x="390" y="${(y1+y2)/2}" text-anchor="middle" transform="rotate(-90 390 ${(y1+y2)/2})">90 mm</text>

const cmsBG=()=>{const b=TPCMS.payload&&TPCMS.payload.bg;if(!b)return;for(const k in b)if(BG[k]){const c=b[k];Object.assign(BG[k],{clip:c.kind==="url"?"url":c.kind==="clip"?c.clip:"",ov:c.ov,url:c.url});if(c.kind==="none"||c.kind==="image")BG[k].mode="off";else if(BG[k].mode==="off")BG[k].mode="scroll"}};
try{const s=JSON.parse(store.get("tp-bg")||"null");if(s){for(const k in s.cfg)if(BG[k])Object.assign(BG[k],s.cfg[k]);BG_ON=s.on!==false}}catch(e){}
const uploads={}; // section -> objectURL (session only; the real dashboard uploads to the media library)
const saveBG=()=>{const cfg={};for(const k in BG){const{clip,mode,ov}=BG[k];cfg[k]={clip:clip==="upload"?BG_DEF[k].clip:clip,mode,ov}}store.set("tp-bg",JSON.stringify({on:BG_ON,cfg}))};
const bgNodes={}; // section -> {wrap,video,ov,prog,cur}
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)");
const VEXT=(()=>{const v=document.createElement("video");return v.canPlayType('video/mp4; codecs="avc1.42E01E"')?"mp4":"webm"})();
function srcFor(k){const c=BG[k];return c.clip==="url"?c.url||"":c.clip==="upload"?uploads[k]:c.clip&&CLIPS[c.clip]?`media/${c.clip}.${VEXT}`:""}
function posterFor(k){const c=BG[k];return c.clip&&CLIPS[c.clip]?`media/${c.clip}.jpg`:""}
let bgIO;
function setupBG(){
 document.documentElement.classList.toggle("nobg",!BG_ON);
 bgIO=bgIO||new IntersectionObserver(es=>es.forEach(e=>{const n=bgNodes[e.target.dataset.bg];if(!n)return;n.near=e.isIntersecting;if(e.isIntersecting)loadBG(e.target.dataset.bg);else if(!n.video.paused)n.video.pause()}),{rootMargin:"60% 0px"});
 for(const k in BG){
  const host=k==="cta"?$("#cta .cta-band"):document.getElementById(k); if(!host)continue;
  let n=bgNodes[k];
  if(!n){const wrap=document.createElement("div");wrap.className="sec-bg";wrap.setAttribute("aria-hidden","true");
   const v=document.createElement("video");v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("muted","");v.preload="auto";v.disablePictureInPicture=true;
   v.addEventListener("loadeddata",()=>v.classList.add("ready"));
   const ov=document.createElement("div");ov.className="ov";const prog=document.createElement("div");prog.className="prog";
   wrap.append(v,ov,prog);n=bgNodes[k]={wrap,video:v,ov,prog,cur:0,src:""}}
  host.dataset.bg=k; host.prepend(n.wrap); bgIO.observe(host);
  applyBG(k);
 }
}
function applyBG(k){
 const n=bgNodes[k],c=BG[k];if(!n)return;
 n.wrap.hidden=c.mode==="off"||!srcFor(k);
 n.ov.style.setProperty("--ov",c.ov);n.ov.style.setProperty("--ov-c",c.oc);
 n.video.loop=c.mode==="loop";
 if(n.src!==srcFor(k)){n.video.classList.remove("ready");n.src="";n.cur=0;n.video.removeAttribute("src");n.video.poster=posterFor(k);if(n.near)loadBG(k)}
 if(c.mode==="loop"&&n.near&&!reduceMotion.matches&&TH.motion)n.video.play().catch(()=>{});else if(c.mode!=="loop")n.video.pause();
}
function loadBG(k){const n=bgNodes[k],s=srcFor(k);if(!n||!s||n.src===s||BG[k].mode==="off")return;n.src=s;n.video.src=s;n.video.load();if(BG[k].mode==="loop"&&TH.motion&&!reduceMotion.matches)n.video.play().catch(()=>{})}
function bgTick(){
 if(BG_ON&&TH.motion&&!reduceMotion.matches){
  const vh=innerHeight;
  for(const k in bgNodes){const n=bgNodes[k];if(!n.near||BG[k].mode!=="scroll")continue;const v=n.video,d=v.duration;if(!d||!isFinite(d))continue;
   const r=n.wrap.parentElement.getBoundingClientRect(),top=r.top+scrollY;
   const start=Math.max(0,top-vh),end=top+r.height;               // from the moment the section enters (or page top) until it leaves at the top
   const p=Math.min(1,Math.max(0,(scrollY-start)/(end-start)));
   const target=p*(d-.05); n.cur+=(target-n.cur)*.2;           // eased so fast scrolls stay smooth
   n.prog.style.width=(p*100).toFixed(1)+"%";
   if(!v.seeking&&Math.abs(v.currentTime-n.cur)>1/48)v.currentTime=n.cur;}
 }
 requestAnimationFrame(bgTick);
}
requestAnimationFrame(bgTick);
/* iOS/Safari only allows seeking a video after one user gesture */
addEventListener("touchstart",function unlock(){for(const k in bgNodes){const v=bgNodes[k].video;if(v.src&&BG[k].mode==="scroll")v.play().then(()=>v.pause()).catch(()=>{})}removeEventListener("touchstart",unlock)},{passive:true});

function bgPanel(){
 const T=L==="ar",c=BG[bgSel];
 const t=T?{h:"خلفيات الفيديو",all:"تفعيل خلفيات الفيديو",sec:"القسم",clip:"الفيديو",none:"بدون",up:"رفع فيديو من جهازك (MP4 / WEBM / MOV)",mode:"طريقة التشغيل",scroll:"يتبع التمرير",loop:"تكرار تلقائي",off:"إيقاف",ov:"قوة الطبقة فوق الفيديو",tip:"اسحب الصفحة للأعلى والأسفل: الفيديو يتقدم ويرجع مع التمرير. الفيديو المرفوع هنا للمعاينة فقط؛ في لوحة التحكم يُحفظ في مكتبة الوسائط."}
 :{h:"Background videos",all:"Enable background videos",sec:"Section",clip:"Video",none:"None",up:"Upload a video (MP4 / WEBM / MOV)",mode:"Playback",scroll:"Follows scroll",loop:"Auto loop",off:"Off",ov:"Overlay strength",tip:"Scroll up and down: the video moves forward and back with the page. Uploads here are preview-only; the dashboard saves them to the media library."};
 return `<hr><div class="tc-grp"><b>${t.h}</b><label class="tgl"><span>${t.all}</span><input type="checkbox" id="bgOn" ${BG_ON?"checked":""}></label></div>
 <div class="tc-grp"><b>${t.sec}</b><select id="bgSec">${Object.keys(BG).map(k=>`<option value="${k}" ${k===bgSel?"selected":""}>${SEC_LBL[k][T?0:1]}</option>`).join("")}</select></div>
 <div class="tc-grp"><b>${t.clip}</b><div class="clip-row">${Object.keys(CLIPS).map(k=>`<button type="button" data-clip="${k}" title="${CLIPS[k][L]}" aria-label="${CLIPS[k][L]}" aria-pressed="${c.clip===k}" style="background-image:url(media/${k}.jpg)"></button>`).join("")}<button type="button" data-clip="none" aria-pressed="${c.clip==="none"}">${t.none}</button></div>
 <label class="up">${uploads[bgSel]&&c.clip==="upload"?"✓ ":""}${t.up}<input type="file" id="bgUp" accept="video/mp4,video/webm,video/quicktime"></label></div>
 <div class="tc-grp"><b>${t.mode}</b><div class="seg" role="group">${["scroll","loop","off"].map(m=>`<button type="button" data-bm="${m}" aria-pressed="${c.mode===m}">${t[m]}</button>`).join("")}</div></div>
 <div class="tc-grp"><b>${t.ov} · <span class="mono" id="bgOvV">${Math.round(c.ov*100)}%</span></b><input type="range" id="bgOv" min="0" max="95" value="${Math.round(c.ov*100)}"></div>
 <p class="note">${t.tip}</p>`;
}
function bindBgPanel(rerender){
 const go=()=>{applyBG(bgSel);saveBG();rerender()};
 $("#bgOn").onchange=e=>{BG_ON=e.target.checked;document.documentElement.classList.toggle("nobg",!BG_ON);saveBG()};
 $("#bgSec").onchange=e=>{bgSel=e.target.value;rerender();const h=bgSel==="cta"?$("#cta"):document.getElementById(bgSel);h&&h.scrollIntoView({behavior:"smooth",block:"start"})};
 $$("#tc [data-clip]").forEach(b=>b.onclick=()=>{BG[bgSel].clip=b.dataset.clip;if(BG[bgSel].mode==="off"&&b.dataset.clip!=="none")BG[bgSel].mode="scroll";go()});
 $$("#tc [data-bm]").forEach(b=>b.onclick=()=>{BG[bgSel].mode=b.dataset.bm;go()});
 $("#bgOv").oninput=e=>{BG[bgSel].ov=e.target.value/100;$("#bgOvV").textContent=e.target.value+"%";applyBG(bgSel);saveBG()};
 $("#bgUp").onchange=e=>{const f=e.target.files[0];if(!f)return;if(uploads[bgSel])URL.revokeObjectURL(uploads[bgSel]);uploads[bgSel]=URL.createObjectURL(f);BG[bgSel].clip="upload";if(BG[bgSel].mode==="off")BG[bgSel].mode="scroll";go()};
}

/* reveal: content is visible at rest; only elements below the fold get a gentle entrance */
function setupReveal(){
 if(!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.remove("pre");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});
 $$(".reveal").forEach(el=>{const r=el.getBoundingClientRect();if(r.top>innerHeight){el.classList.add("pre");io.observe(el)}});
}

/* ---------- CMS hooks: sections, custom blocks, hero media, SEO, live preview ---------- */
function cmsAfterRender(){
 const P=TPCMS.payload; if(!P)return;
 const main=$("main"),hr=$("main > hr.crease");
 for(const s of P.sections){
  let el=document.getElementById(s.id);
  if(s.custom){
   if(!el){el=document.createElement("section");el.id=s.id;el.className="cms-custom"}
   const t=s.custom[L]||s.custom.ar,img=TPCMS.mediaUrl(s.custom.image);
   el.innerHTML=`<div class="wrap"><div class="sec-head"><div><div class="eyebrow mono">${esc(t.eyebrow||"")}</div><h2>${esc(t.h2||"")}</h2></div><div><p>${esc(t.p||"")}</p>${t.btn?`<a class="btn btn-accent" href="${esc(t.href||"#contact")}" style="margin-top:20px">${esc(t.btn)} <span class="arr">←</span></a>`:""}</div></div>${img?`<img class="cms-img" src="${img}" alt="" loading="lazy">`:""}</div>`;
  }
  if(!el)continue;
  el.hidden=s.visible===false; main.appendChild(el);
  if(s.id==="services"&&hr)main.appendChild(hr);
 }
 $$("main > section.cms-custom").forEach(el=>{if(!P.sections.some(s=>s.id===el.id))el.remove()});
 const hb=P.bg&&P.bg.hero,hi=hb&&hb.kind==="image"&&TPCMS.mediaUrl(hb.image),h=$("#hero");
 h.classList.toggle("cms-hero-img",!!hi);
 h.style.backgroundImage=hi?`linear-gradient(color-mix(in srgb,var(--bg) ${Math.round(hb.ov*100)}%,transparent),color-mix(in srgb,var(--bg) ${Math.round(hb.ov*100)}%,transparent)),url("${hi}")`:"";
 const seo=P.seo&&P.seo[L]; if(seo){document.title=seo.title;let m=$('meta[name="description"]');if(!m){m=document.createElement("meta");m.name="description";document.head.appendChild(m)}m.content=seo.desc}
}
function cmsReload(p){
 if(!p)return; TPCMS.payload=p; TPCMS.apply(p);
 Object.assign(TH,p.theme); cmsBG(); applyTheme(); render(); for(const k in bgNodes)applyBG(k);
}
if(TPCMS.preview){
 addEventListener("storage",e=>{if(e.key===(TPCMS.mode==="work"?TPCMS.K.work:TPCMS.K.draft)||e.key===TPCMS.K.media)cmsReload(TPCMS.read())});
 addEventListener("message",e=>{if(e.origin!==location.origin||!e.data||!e.data.tpScroll)return;const el=document.getElementById(e.data.tpScroll);if(el&&!el.hidden){scrollTo({top:el.getBoundingClientRect().top+scrollY-($(".hdr")?$(".hdr").offsetHeight:0),behavior:"smooth"});/* window-local: scrollIntoView would also scroll the embedding dashboard */el.classList.remove("cms-flash");void el.offsetWidth;el.classList.add("cms-flash")}});
 if(TPCMS.mode!=="work"){const b=document.createElement("div");b.className="cms-bar";b.innerHTML=`<b>${TPCMS.mode==="draft"?"معاينة المسودة":"معاينة الإصدار "+esc(TPCMS.mode.slice(1))}</b><span>غير منشورة · PREVIEW</span><a href="index.html">الموقع المنشور</a><a href="admin.html">لوحة التحكم</a>`;document.body.appendChild(b)}
 else document.documentElement.classList.add("cms-embed");
}
if(!TPCMS.preview)addEventListener("storage",e=>{if(e.key===TPCMS.K.live)cmsReload(TPCMS.read("live"))});

/* ---------- boot (after the CMS has loaded the content: instant locally, one request with Supabase) ---------- */
TPCMS.ready.then(()=>{
if(TPCMS.remote&&TPCMS.payload)Object.assign(TH,TPCMS.payload.theme);
cmsBG();
L=(TPCMS.preview&&new URLSearchParams(location.search).get("lang"))||store.get("tp-lang")||"ar";
applyTheme(); render();
$("#langBtn").onclick=()=>{L=L==="ar"?"en":"ar";store.set("tp-lang",L);render()};
$("#menuBtn").onclick=()=>{const n=$("#nav");n.classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",n.classList.contains("open"))};
$("#nav").addEventListener("click",e=>{if(e.target.tagName==="A")$("#nav").classList.remove("open")});
$("#tcFab").onclick=openTC; $("#scrim").onclick=closeTC;
$("#lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLB()});
$("#lb .lb-close").onclick=closeLB;
document.addEventListener("keydown",e=>{if($("#lb").hidden)return;if(e.key==="Escape")closeLB();if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const d=(e.key==="ArrowLeft")===(C.dir==="rtl")?1:-1;lbIndex=(lbIndex+d+lbList.length)%lbList.length;drawLB()}});
});
})();
</script>
