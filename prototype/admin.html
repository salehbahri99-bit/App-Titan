<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة التحكم — Titan Pack</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Titan Pack dashboard prototype: CMS, visual builder, theme engine, media library and publishing.">
<script>try{var t=JSON.parse(localStorage.getItem("tp-admin-ui")||"{}").theme;if(t&&t!=="auto")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Reem+Kufi:wght@500;700&family=Cairo:wght@600;800&display=swap">
<style>/* Titan Pack design tokens — shared by the public site and the dashboard. */
:root{
  --bg:#F7F2E6; --surface:#FFFCF4; --surface-2:#EFE6D0; --ink:#1E2A2E; --muted:#56666A;
  --line:rgba(6,65,79,.16); --line-strong:rgba(6,65,79,.38);
  --primary:#06414F; --primary-ink:#06414F; --on-primary:#F4ECD5;
  --accent:#EF974F; --accent-ink:#B8621F; --charcoal:#3D3D3D; --cream:#F4ECD5;
  --success:#2F7D5B; --warning:#C98A1B; --error:#B83A2E;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Alexandria",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:14px; --radius-sm:8px; --container:1240px; --gutter:clamp(16px,4vw,40px);
  --speed:1; --ease:cubic-bezier(.2,.7,.2,1);
  --logo-light:block; --logo-dark:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#02222A; --surface:#062F39; --surface-2:#0A3A45; --ink:#F4ECD5; --muted:#A7B7B4;
  --line:rgba(244,236,213,.12); --line-strong:rgba(244,236,213,.32);
  --primary:#0B5566; --primary-ink:#8CC6D0; --on-primary:#F4ECD5; --accent-ink:#F2A868;
  --logo-light:none; --logo-dark:block; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#02222A; --surface:#062F39; --surface-2:#0A3A45; --ink:#F4ECD5; --muted:#A7B7B4;
  --line:rgba(244,236,213,.12); --line-strong:rgba(244,236,213,.32);
  --primary:#0B5566; --primary-ink:#8CC6D0; --on-primary:#F4ECD5; --accent-ink:#F2A868;
  --logo-light:none; --logo-dark:block; color-scheme:dark;}

/* Titan Pack dashboard — same tokens as the public site; the sidebar is the "press plate", content sits on the paper. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.ico{flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ltr{direction:ltr;unicode-bidi:isolate}
fieldset.pg{border:0;margin:0;padding:0;min-width:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.62em 1.1em;border-radius:calc(var(--radius) * .6);border:1px solid transparent;background:none;font-weight:600;font-size:.9rem;line-height:1.2;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-accent{background:var(--accent);color:#2A1606}
.btn-accent:hover{background:#F5A866}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-quiet{color:var(--muted);padding-inline:.7em}
.btn-quiet:hover{color:var(--ink);background:var(--surface-2)}
.btn-danger{color:var(--error);border-color:color-mix(in srgb,var(--error) 40%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--error) 10%,transparent)}
.btn-sm{padding:.42em .8em;font-size:.82rem}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;flex:none;color:var(--ink)}
.icon-btn:hover{border-color:var(--line-strong)}
.icon-btn.sm{width:30px;height:30px;border-radius:8px}
.icon-btn[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-art{background:var(--primary);color:var(--on-primary);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background-image:linear-gradient(rgba(244,236,213,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(244,236,213,.06) 1px,transparent 1px);background-size:28px 28px}
.login-art h1{font-size:clamp(2rem,3.6vw,3.2rem);max-width:14ch}
.login-art h1 em{font-style:normal;color:var(--accent)}
.login-art svg.die{position:absolute;inset-inline-end:-30px;top:12%;width:min(460px,58%);opacity:.9}
.login-art .brand img{width:44px;height:44px}
.login-form{display:grid;place-items:center;padding:40px 24px}
.login-form form{width:min(400px,100%);display:grid;gap:16px}
.login-form h2{font-size:1.6rem}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles label{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.roles label:has(input:checked){border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.roles b{display:block;font-size:.9rem}.roles small{color:var(--muted);font-size:.75rem;line-height:1.4;display:block}
.roles input{margin-top:4px;accent-color:var(--primary)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{min-height:260px;padding:28px}.login-art svg.die{width:300px}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--primary);color:var(--on-primary);display:flex;flex-direction:column;padding:18px 14px;gap:4px;scrollbar-width:thin}
:root[data-theme="dark"] .side{background:#021B21;border-inline-end:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#021B21;border-inline-end:1px solid var(--line)}}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;text-decoration:none;border-bottom:1px dashed rgba(244,236,213,.22);margin-bottom:8px}
.side .brand img{width:36px;height:36px}
.side .brand b{font-family:var(--f-display);font-size:1.02rem;display:block;line-height:1.15}
.side .brand small{font-family:var(--f-mono);font-size:.58rem;letter-spacing:.2em;opacity:.6;display:block;direction:ltr;text-align:start}
.side .grp{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.18em;opacity:.5;padding:14px 10px 6px;direction:ltr;text-align:end}
[dir="rtl"] .side .grp{text-align:right}
.side a.nv{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;text-decoration:none;font-size:.9rem;color:color-mix(in srgb,var(--on-primary) 82%,transparent);position:relative;transition:background .15s,color .15s}
.side a.nv:hover{background:rgba(244,236,213,.07);color:var(--on-primary)}
.side a.nv[aria-current="page"]{background:rgba(244,236,213,.12);color:var(--on-primary);font-weight:600}
.side a.nv[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side a.nv .cnt{margin-inline-start:auto;font-family:var(--f-mono);font-size:.65rem;background:var(--accent);color:#2A1606;border-radius:99px;padding:1px 7px}
.side a.nv.locked{opacity:.45}
.side .me{margin-top:auto;padding:12px 8px 2px;border-top:1px dashed rgba(244,236,213,.22);display:flex;gap:10px;align-items:center}
.side .me .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#2A1606;display:grid;place-items:center;font-weight:700;flex:none}
.side .me b{display:block;font-size:.86rem;line-height:1.2}
.side .me span{font-size:.72rem;opacity:.65}
.side .me button{margin-inline-start:auto;background:rgba(244,236,213,.08);border:0;color:inherit;border-radius:8px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.side-scrim{position:fixed;inset:0;background:rgba(2,20,25,.45);z-index:70}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,2.4vw,28px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .ttl{min-width:0}
.top .ttl small{display:block;color:var(--muted);font-size:.72rem}
.top .ttl h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.menu-btn{display:none}
.seg{display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:99px}
.seg button{border:0;background:none;padding:.34em .9em;border-radius:99px;cursor:pointer;font-size:.8rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.status{display:inline-flex;align-items:center;gap:8px;padding:.4em .85em;border-radius:99px;font-size:.8rem;border:1px solid var(--line);background:var(--surface);white-space:nowrap;cursor:pointer}
.status i{width:8px;height:8px;border-radius:50%;background:var(--success)}
.status.unsaved i{background:var(--warning);box-shadow:0 0 0 4px color-mix(in srgb,var(--warning) 22%,transparent)}
.status.draft i{background:var(--accent)}
.view{padding:clamp(16px,2.4vw,28px);display:grid;gap:20px;align-content:start;outline:none;max-width:1440px;width:100%}
@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:280px;z-index:80;transform:translateX(100%);transition:transform .25s var(--ease)}
  [dir="ltr"] .side{transform:translateX(-100%)}
  .side.open{transform:none!important}
  .menu-btn{display:inline-grid}
}
@media (max-width:720px){
  .top{gap:8px}
  .top .tools{width:100%;margin-inline-start:0;justify-content:space-between}
  .top .hide-sm{display:none}
  .top .ttl{flex:1}
}

/* ---------- page primitives ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h2{font-size:clamp(1.4rem,2.4vw,1.9rem)}
.ph p{color:var(--muted);max-width:70ch;margin-top:4px}
.ph .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:8px;color:var(--accent-ink);margin-bottom:6px}
.eyebrow::before{content:"";width:22px;border-top:1.5px dashed currentColor}
.eyebrow.mono{direction:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;min-width:0;position:relative}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:1.02rem}
.card-h .sub{color:var(--muted);font-size:.8rem}
.card-h .r{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.crop{position:absolute;width:14px;height:14px;pointer-events:none;opacity:.5}
.crop::before,.crop::after{content:"";position:absolute;background:var(--ink)}
.crop::before{width:14px;height:1px;top:0}.crop::after{width:1px;height:14px;left:0}
.crop.tl{top:-7px;left:-7px}.crop.tr{top:-7px;right:-7px;transform:scaleX(-1)}.crop.bl{bottom:-7px;left:-7px;transform:scaleY(-1)}.crop.br{bottom:-7px;right:-7px;transform:scale(-1)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.split.rev{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr)}
.split.mlayout{grid-template-columns:220px minmax(0,1fr)}
@media (max-width:1180px){.g3{grid-template-columns:1fr 1fr}.split,.split.rev,.split.mlayout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.crease{border:0;border-top:1px dashed var(--line-strong);margin:4px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--surface-2);white-space:nowrap;font-weight:500}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--success);background:color-mix(in srgb,var(--success) 12%,transparent)}
.badge.warn{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,transparent)}
.badge.err{color:var(--error);background:color-mix(in srgb,var(--error) 12%,transparent)}
.badge.acc{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.badge.pri{color:var(--primary-ink);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.note{font-size:.8rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--surface-2);line-height:1.6}
.note b{color:var(--ink)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;text-decoration:none;display:block;transition:border-color .15s}
.kpi:hover{border-color:var(--line-strong)}
.kpi .k{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem}
.kpi .k .ico{color:var(--accent-ink)}
.kpi b{display:block;font-family:var(--f-display);font-size:1.9rem;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi b small{font-size:.9rem;color:var(--muted);font-weight:500}
.kpi .d{font-size:.76rem;color:var(--muted);margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:var(--primary-ink);border-radius:99px}

/* ---------- publish card ---------- */
.pub{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.pub h3{font-size:1.3rem;display:flex;align-items:center;gap:10px}
.pub .dot{width:12px;height:12px;border-radius:50%;background:var(--success)}
.pub .dot.unsaved{background:var(--warning)}.pub .dot.draft{background:var(--accent)}
.pub .acts{display:flex;gap:8px;flex-wrap:wrap}
.flow{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.flow span{padding:3px 10px;border-radius:99px;border:1px dashed var(--line-strong)}
.flow span.on{border-style:solid;border-color:var(--primary-ink);color:var(--primary-ink);font-weight:600}
.flow span.done{background:var(--surface-2);border-color:transparent;color:var(--ink)}
.changes{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px;max-height:220px;overflow:auto}
.changes li{display:flex;gap:8px;align-items:center;font-size:.85rem}
.changes li .mono{color:var(--muted);min-width:64px}
@media (max-width:760px){.pub{grid-template-columns:1fr}}

/* ---------- lists / tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-weight:600;font-size:.74rem;color:var(--muted);text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.tscroll{overflow-x:auto}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.row.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.row.dragging{opacity:.45}
.row.off{opacity:.55}
.row .grip{cursor:grab;color:var(--muted);display:grid;place-items:center;width:22px;flex:none;touch-action:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);width:22px;text-align:center;flex:none}
.row .ic{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--primary-ink);flex:none}
.row .acts{display:flex;gap:4px;flex:none}
.row.sel{border-color:var(--primary-ink);box-shadow:inset 0 0 0 1px var(--primary-ink)}

/* ---------- forms ---------- */
.form{display:grid;gap:14px}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.fld>.lbl{font-size:.8rem;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.fld>label .cnt{font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:.68rem}
.fld>label .cnt.over{color:var(--error)}
.fld .hint{font-size:.74rem;color:var(--muted)}
.inp,.fld input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),.fld select,.fld textarea{width:100%;padding:.62em .8em;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
.fld textarea{min-height:88px;resize:vertical;line-height:1.6}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--primary-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
.fld :disabled{opacity:.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.f2,.f3{grid-template-columns:1fr}}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:.88rem}
.tgl input{appearance:none;width:40px;height:22px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;transition:background .15s;flex:none;margin:0}
.tgl input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .18s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl input:checked{background:var(--success)}
[dir="rtl"] .tgl input:checked::after{transform:translateX(-18px)}
[dir="ltr"] .tgl input:checked::after{transform:translateX(18px)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search .ico{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding:.55em .8em;padding-inline-start:34px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--primary-ink)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.3em .85em;font-size:.8rem;cursor:pointer;white-space:nowrap}
.chipb sup{font-family:var(--f-mono);font-size:.6rem;color:var(--muted);margin-inline-start:3px}
.chipb[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipb[aria-pressed="true"] sup{color:inherit;opacity:.7}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);min-height:42px;align-items:center}
.tags span{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:2px 4px 2px 10px;font-size:.8rem}
.tags span button{border:0;background:none;cursor:pointer;color:var(--muted);width:20px;height:20px;border-radius:50%;line-height:1}
.tags span button:hover{background:var(--line)}
.tags input{border:0!important;background:none!important;flex:1;min-width:100px;padding:4px!important;box-shadow:none!important}
.swatches{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.color{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg)}
.color input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer;border-radius:6px;flex:none}
.color input[type=text]{border:0!important;background:none!important;padding:2px!important;box-shadow:none!important;font-family:var(--f-mono);font-size:.8rem;direction:ltr;width:100%}
.color span{font-size:.8rem;flex:1;min-width:0}
input[type=range]{accent-color:var(--primary-ink);width:100%}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.opt-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--primary-ink)}
.opt-grid button[aria-pressed="true"]{border-color:var(--primary-ink);box-shadow:inset 0 0 0 1px var(--primary-ink);background:var(--surface-2)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:.28em .8em;font-size:.8rem;cursor:pointer;background:var(--bg)}
.checks label:has(input:checked){border-color:var(--primary-ink);background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary-ink);font-weight:600}
.checks input{accent-color:var(--primary-ink);margin:0}

/* ---------- media thumbs / projects ---------- */
.thumb{aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;position:relative}
.thumb svg,.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ftype{font-family:var(--f-mono);font-weight:600;font-size:.9rem;color:var(--primary-ink);display:grid;justify-items:center;gap:6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;text-align:start;padding:0}
.pcard:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.pcard .thumb{border-radius:0;aspect-ratio:5/4}
.pcard .meta{padding:12px 14px 14px;display:grid;gap:3px}
.pcard .meta b{font-size:.95rem}
.pcard .meta span{font-size:.78rem;color:var(--muted)}
.pcard .tl{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:4px}
.pcard .tr{position:absolute;top:8px;inset-inline-end:8px;display:flex;gap:4px}
.pcard .star{background:var(--surface);border:0;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pcard .star[aria-pressed="true"]{color:var(--accent)}
.pcard .star[aria-pressed="true"] svg{fill:currentColor}
.pcard.dragging{opacity:.4}
.pcard.drag-over{outline:2px dashed var(--accent);outline-offset:3px}
.pcard .order{position:absolute;bottom:calc(100% - 26px);inset-inline-end:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.mitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;cursor:pointer;text-align:start;position:relative;transition:border-color .15s}
.mitem:hover{border-color:var(--line-strong)}
.mitem[aria-pressed="true"]{border-color:var(--primary-ink);box-shadow:inset 0 0 0 1px var(--primary-ink)}
.mitem b{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;direction:ltr;text-align:start}
.mitem span{font-size:.7rem;color:var(--muted)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s;display:grid;gap:4px;justify-items:center}
.drop.over,.drop:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);color:var(--ink)}
.drop small{font-family:var(--f-mono);font-size:.66rem}
.pick{display:flex;gap:10px;align-items:center}
.pick .thumb{width:84px;flex:none}
.folders{display:grid;gap:2px}
.folders button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:9px;cursor:pointer;text-align:start;font-size:.88rem}
.folders button:hover{background:var(--surface-2)}
.folders button[aria-pressed="true"]{background:var(--surface-2);font-weight:600}
.folders button span{margin-inline-start:auto;font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}

/* ---------- preview frame ---------- */
.pv{position:sticky;top:84px;display:grid;gap:10px}
.pv-bar{display:flex;align-items:center;gap:8px}
.pv-bar .url{flex:1;min-width:0;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.45em .9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr}
.pv-stage{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);height:calc(100vh - 170px);min-height:460px;overflow:hidden;display:grid;justify-items:center;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:22px 22px}
.pv-stage iframe{border:0;background:var(--bg);width:100%;height:100%;transition:width .3s var(--ease);box-shadow:0 0 0 1px var(--line)}
.pv-stage.tablet iframe{width:min(820px,100%)}
.pv-stage.mobile iframe{width:390px;max-width:100%}
.pv-scale{width:100%;height:100%;overflow:hidden;display:flex;justify-content:center}
.pv-scale iframe{transform-origin:top center;flex:none}
@media (max-width:1180px){.pv{position:static}.pv-stage{height:70vh}}

/* ---------- builder ---------- */
.sec-type{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);direction:ltr}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.types button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px 10px;display:grid;justify-items:center;gap:6px;cursor:pointer;font-size:.82rem;text-align:center;color:var(--ink)}
.types button:hover{border-color:var(--primary-ink);background:var(--surface-2)}
.types button .ico{color:var(--primary-ink)}
.types button small{color:var(--muted);font-size:.7rem}

/* ---------- editor tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-size:.88rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.art-prev{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--surface-2)}
.art-prev svg,.art-prev img{width:100%;height:100%;display:block;object-fit:cover}

/* ---------- SEO previews ---------- */
.serp{background:#fff;color:#202124;border-radius:12px;padding:16px 18px;font-family:Arial,system-ui,sans-serif;border:1px solid var(--line)}
.serp .u{font-size:.8rem;color:#4d5156;direction:ltr;text-align:start}
.serp .t{font-size:1.2rem;color:#1a0dab;line-height:1.3;margin:4px 0}
.serp .d{font-size:.86rem;color:#4d5156;line-height:1.55}
.og{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.og .im{aspect-ratio:1.91/1;background:var(--primary);display:grid;place-items:center;color:var(--on-primary)}
.og .im img{width:100%;height:100%;object-fit:cover}
.og .tx{padding:10px 14px;display:grid;gap:2px}
.og .tx span{font-size:.72rem;color:var(--muted);direction:ltr;text-align:start}
.og .tx b{font-size:.9rem}
pre.code{background:#0B2229;color:#CFE3E6;border-radius:12px;padding:14px;font-family:var(--f-mono);font-size:.74rem;line-height:1.6;overflow:auto;max-height:280px;direction:ltr;text-align:left;margin:0}

/* ---------- acceptance checklist ---------- */
.checklist{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;counter-reset:ck}
.checklist li{display:flex;gap:10px;align-items:center;font-size:.84rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.checklist li::before{counter-increment:ck;content:counter(ck,decimal-leading-zero);font-family:var(--f-mono);font-size:.64rem;color:var(--muted);width:18px}
.checklist li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;display:grid;place-items:center;font-style:normal;font-size:.7rem;color:#fff}
.checklist li.done i{background:var(--success);border-color:var(--success)}
.checklist li.done{color:var(--muted)}
.checklist li a{margin-inline-start:auto;font-size:.74rem;color:var(--accent-ink);text-decoration:none;white-space:nowrap}
@media (max-width:640px){.checklist{grid-template-columns:1fr}}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--success) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1rem}

/* ---------- activity / timeline ---------- */
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start}
.feed li:last-child{border-bottom:0}
.feed .av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--primary-ink)}
.feed b{font-size:.86rem}
.feed p{font-size:.8rem;color:var(--muted)}
.feed time{font-size:.72rem;color:var(--muted);white-space:nowrap}
.vers{display:grid;gap:0;position:relative}
.ver{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.ver .vn{font-family:var(--f-mono);font-weight:600;font-size:.8rem;width:52px;height:52px;border-radius:12px;border:1px solid var(--line-strong);display:grid;place-items:center}
.ver.live .vn{background:var(--success);border-color:var(--success);color:#fff}
.ver .chg{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ver .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.ver{grid-template-columns:auto minmax(0,1fr)}.ver .acts{grid-column:1/-1;justify-content:flex-start}}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.chart .c{flex:1;display:grid;justify-items:center;gap:6px;height:100%;align-content:end;min-width:0}
.chart .c i{display:block;width:100%;max-width:28px;border-radius:5px 5px 2px 2px;background:var(--primary-ink);min-height:2px;position:relative}
.chart .c:last-child i{background:var(--accent)}
.chart .c span{font-family:var(--f-mono);font-size:.58rem;color:var(--muted);white-space:nowrap}
.chart .c i:hover::after{content:attr(data-v);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:.7rem;padding:2px 7px;border-radius:6px;white-space:nowrap;font-family:var(--f-mono)}

/* ---------- permissions ---------- */
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:start}
.perm .y{color:var(--success);font-weight:700}.perm .n{color:var(--muted)}

/* ---------- overlays ---------- */
.modal{position:fixed;inset:0;z-index:100;background:rgba(2,20,25,.5);display:grid;place-items:center;padding:16px;animation:fade .15s}
.modal .box{background:var(--surface);border-radius:calc(var(--radius) + 2px);width:min(560px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.modal .box.wide{width:min(920px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:1.1rem}
.modal .mh .icon-btn{margin-inline-start:auto}
.modal .mb{padding:18px 20px;overflow:auto;display:grid;gap:14px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.drawer-wrap{position:fixed;inset:0;z-index:90}
.drawer-scrim{position:absolute;inset:0;background:rgba(2,20,25,.35);animation:fade .15s}
.drawer{position:absolute;inset-block:0;inset-inline-end:0;width:min(520px,100%);background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.25);animation:slideIn .22s var(--ease)}
[dir="ltr"] .drawer{animation-name:slideInL}
.drawer .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer .mh h3{font-size:1.08rem}
.drawer .mh .icon-btn{margin-inline-start:auto}
.drawer .mb{padding:18px 20px;overflow:auto;display:grid;gap:14px;align-content:start;flex:1}
.drawer .mf{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}}
@keyframes slideInL{from{transform:translateX(30px);opacity:0}}
.toasts{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);z-index:120;display:grid;gap:8px;justify-items:center;pointer-events:none}
[dir="ltr"] .toasts{transform:translateX(-50%)}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:.86rem;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .25s var(--ease);display:flex;gap:8px;align-items:center;pointer-events:auto}
.toast.err{background:var(--error);color:#fff}
.toast.ok::before{content:"✓";color:var(--success);font-weight:700}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}}

/* ---------- AI assistant ---------- */
.ai{position:fixed;inset-block:0;inset-inline-end:0;width:min(420px,100%);z-index:85;background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 0 50px rgba(0,0,0,.2);animation:slideIn .22s var(--ease)}
.ai-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--primary);color:var(--on-primary)}
.ai-h .spark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#2A1606;display:grid;place-items:center}
.ai-h b{display:block;font-family:var(--f-display)}
.ai-h small{font-size:.7rem;opacity:.7}
.ai-h .icon-btn{margin-inline-start:auto;background:rgba(244,236,213,.1);border-color:transparent;color:inherit}
.ai-log{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;font-size:.88rem;line-height:1.65}
.msg.u{background:var(--primary);color:var(--on-primary);justify-self:start;border-end-start-radius:4px}
.msg.a{background:var(--surface-2);justify-self:end;border-end-end-radius:4px}
[dir="rtl"] .msg.u{justify-self:start}
.msg .plan{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.msg .plan li{font-size:.8rem}
.msg .plan ul{margin:0;padding-inline-start:18px}
.msg .plan .acts{display:flex;gap:6px;flex-wrap:wrap}
.msg .plan .warn{font-size:.74rem;color:var(--warning);font-weight:600}
.ai-sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.ai-sug button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:.3em .8em;font-size:.76rem;cursor:pointer}
.ai-sug button:hover{border-color:var(--primary-ink)}
.ai-f{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.ai-f textarea{flex:1;resize:none;height:44px;padding:.6em .8em;border:1px solid var(--line-strong);border-radius:12px;background:var(--bg);outline:none}
.ai-f textarea:focus{border-color:var(--primary-ink)}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}

.readonly-bar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--warning) 12%,transparent);color:var(--ink);font-size:.85rem;border:1px solid color-mix(in srgb,var(--warning) 35%,transparent)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pv,.pv-bar,.pv-stage,.pv-scale{min-width:0}
.pv-stage{grid-template-columns:minmax(0,1fr)}
@media (max-width:640px){
  .row{flex-wrap:wrap}
  .row .t{flex-basis:calc(100% - 110px)}
  .row .acts{width:100%;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:8px}
  .pv-bar .url{display:none}
}
</style>
</head>
<body>
<a id="top"></a>
<div class="login" id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="القائمة الرئيسية"></aside>
  <div class="side-scrim" id="sideScrim" hidden></div>
  <div class="main">
    <header class="top" id="topbar"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<aside class="ai" id="ai" hidden aria-label="المساعد الذكي"></aside>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>

/* ---------- packaging render generator (isometric SVG) ---------- */
const SHAPES={cube:[1,1,1],tall:[.72,.72,1.75],wide:[1.7,1.2,.42],bar:[1.5,.62,.85],flat:[1.55,1.3,.3]};
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return"#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
let artUid=0;
function boxArt(p,W=400,H=300,opt={}){
 if(p.coverUrl)return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${tpEsc(opt.alt||p.lbl)}"><image href="${p.coverUrl}" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/></svg>`;
 const [w,d,h]=SHAPES[p.shape]; const c=.866;
 const P=(x,y,z)=>[(x-z)*c,(x+z)*.5-y];
 const V=[P(0,0,d),P(w,0,d),P(w,0,0),P(0,h,0),P(w,h,0),P(w,h,d),P(0,h,d)];
 const xs=V.map(v=>v[0]),ys=V.map(v=>v[1]);
 const bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
 const s=Math.min(W*.56/bw,H*.64/bh); const ox=W/2-(Math.min(...xs)+bw/2)*s, oy=H*.5-(Math.min(...ys)+bh/2)*s+H*.02;
 const Q=(x,y,z)=>{const q=P(x,y,z);return[(q[0]*s+ox).toFixed(1),(q[1]*s+oy).toFixed(1)]};
 const poly=a=>a.map(q=>q.join(",")).join(" ");
 const A=[Q(0,0,d),Q(w,0,d),Q(w,h,d),Q(0,h,d)], B=[Q(w,0,0),Q(w,0,d),Q(w,h,d),Q(w,h,0)], T=[Q(0,h,0),Q(w,h,0),Q(w,h,d),Q(0,h,d)];
 const mA=`matrix(${(c*s).toFixed(3)},${(.5*s).toFixed(3)},0,${s.toFixed(3)},${Q(0,h,d).join(",")})`;
 const mB=`matrix(${(c*s).toFixed(3)},${(-.5*s).toFixed(3)},0,${s.toFixed(3)},${Q(w,h,d).join(",")})`;
 const mT=`matrix(${(c*s).toFixed(3)},${(.5*s).toFixed(3)},${(-c*s).toFixed(3)},${(.5*s).toFixed(3)},${Q(0,h,0).join(",")})`;
 const id="a"+(++artUid);
 // artwork on the front face (local units: u 0..w, v 0..h)
 const fw=w,fh=h,fs=Math.min(fw,fh);
 let art="";
 const lbl=`<text x="${fw/2}" y="${fh*.56}" text-anchor="middle" font-family="Alexandria,sans-serif" font-weight="800" font-size="${(fs*.17).toFixed(3)}" letter-spacing="${(fs*.012).toFixed(3)}" fill="${p.c3}">${tpEsc(p.lbl)}</text>`;
 const sub=`<text x="${fw/2}" y="${fh*.56+fs*.12}" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="${(fs*.055).toFixed(3)}" letter-spacing="${(fs*.01).toFixed(3)}" fill="${p.c3}" opacity=".75">${tpEsc(p.sub||"EST. 2026")}</text>`;
 switch(p.pat){
  case"band":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><rect y="${fh*.36}" width="${fw}" height="${fh*.34}" fill="${p.c2}"/>${lbl.replace(p.c3,p.c1)}${sub.replace(p.c3,p.c1)}<circle cx="${fw/2}" cy="${fh*.2}" r="${fs*.07}" fill="none" stroke="${p.c2}" stroke-width="${fs*.012}"/>`;break;
  case"arc":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><circle cx="${fw/2}" cy="${fh*1.02}" r="${fw*.62}" fill="${p.c2}"/><circle cx="${fw*.5}" cy="${fh*.24}" r="${fs*.05}" fill="${p.c2}"/>${lbl}${sub}`;break;
  case"frame":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><rect x="${fs*.07}" y="${fs*.07}" width="${fw-fs*.14}" height="${fh-fs*.14}" fill="none" stroke="${p.c2}" stroke-width="${fs*.012}"/><rect x="${fs*.1}" y="${fs*.1}" width="${fw-fs*.2}" height="${fh-fs*.2}" fill="none" stroke="${p.c2}" stroke-width="${fs*.004}"/>${lbl}${sub}`;break;
  case"split":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><path d="M0 ${fh*.62} L${fw} ${fh*.3} L${fw} ${fh} L0 ${fh}Z" fill="${p.c2}"/><rect x="${fw*.08}" y="${fh*.1}" width="${fs*.14}" height="${fs*.14}" fill="${p.c2}"/><rect x="${fw*.08+fs*.045}" y="${fh*.1+fs*.018}" width="${fs*.05}" height="${fs*.104}" fill="${p.c1}"/><rect x="${fw*.08+fs*.018}" y="${fh*.1+fs*.045}" width="${fs*.104}" height="${fs*.05}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.4}"`).replace(`text-anchor="middle"`,`text-anchor="start"`).replace(`x="${fw/2}"`,`x="${fw*.08}"`)}`;break;
  case"dots":{let dots="";for(let i=0;i<7;i++)for(let j=0;j<11;j++)dots+=`<circle cx="${(i+.5)*fw/7}" cy="${(j+.5)*fh/11}" r="${fs*.018}" fill="${p.c2}" opacity=".55"/>`;art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/>${dots}<rect x="${fw*.12}" y="${fh*.4}" width="${fw*.76}" height="${fs*.3}" rx="${fs*.03}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.4+fs*.2}"`)}`;break}
  case"stripes":{let st="";for(let i=0;i<10;i+=2)st+=`<rect x="${i*fw/10}" width="${fw/10}" height="${fh}" fill="${p.c2}"/>`;art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/>${st}<ellipse cx="${fw/2}" cy="${fh/2}" rx="${fw*.3}" ry="${fh*.34}" fill="${p.c1}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh*.56}"`).replace(/fill="[^"]+">/,`fill="${p.c3}">`)}`;break}
  case"kraft":art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><circle cx="${fw/2}" cy="${fh/2}" r="${fs*.26}" fill="none" stroke="${p.c2}" stroke-width="${fs*.02}"/><circle cx="${fw/2}" cy="${fh/2}" r="${fs*.21}" fill="none" stroke="${p.c2}" stroke-width="${fs*.006}" stroke-dasharray="${fs*.02} ${fs*.015}"/>${lbl.replace(`y="${fh*.56}"`,`y="${fh/2+fs*.05}"`).replace(/fill="[^"]+">/,`fill="${p.c2}">`).replace(/font-size="[^"]+"/,`font-size="${(fs*.11).toFixed(3)}"`)}`;break;
  default:art=`<rect width="${fw}" height="${fh}" fill="${p.c1}"/><text x="${fw/2}" y="${fh*.52}" text-anchor="middle" font-family="Arial,sans-serif" font-size="${fs*.12}" fill="${p.c3}">${tpEsc(p.lbl)}</text><rect x="${fw*.3}" y="${fh*.6}" width="${fw*.4}" height="${fs*.03}" fill="${p.c3}" opacity=".5"/>`;
 }
 const side=p.pat==="kraft"?`<rect width="${d}" height="${h}" fill="${p.c1}"/><rect y="${h*.8}" width="${d}" height="${h*.2}" fill="${p.c2}" opacity=".85"/>`:
   `<rect width="${d}" height="${h}" fill="${p.pat==="band"||p.pat==="arc"?p.c2:p.c1}"/><text x="${d/2}" y="${h/2}" text-anchor="middle" transform="rotate(90 ${d/2} ${h/2})" font-family="IBM Plex Mono,monospace" font-size="${Math.min(d,h)*.09}" letter-spacing="${Math.min(d,h)*.02}" fill="${p.pat==="band"||p.pat==="arc"?p.c1:p.c2}">${tpEsc(p.lbl)}</text>`;
 const top=`<rect width="${w}" height="${d}" fill="${p.pat==="frame"?p.c1:shade(p.c1,.08)}"/>${p.pat==="frame"?`<rect x="${Math.min(w,d)*.08}" y="${Math.min(w,d)*.08}" width="${w-Math.min(w,d)*.16}" height="${d-Math.min(w,d)*.16}" fill="none" stroke="${p.c2}" stroke-width="${Math.min(w,d)*.01}"/>`:""}`;
 const grid=opt.grid===false?"":`<pattern id="${id}g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="${shade(p.bg,-.1)}" stroke-width=".6"/></pattern><rect width="${W}" height="${H}" fill="url(#${id}g)" opacity=".7"/>`;
 const floor=Q(w/2,0,d/2);
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${tpEsc(opt.alt||p.lbl)}"><defs><clipPath id="${id}a"><rect width="${w}" height="${h}"/></clipPath><clipPath id="${id}b"><rect width="${d}" height="${h}"/></clipPath><linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></linearGradient></defs>
 <rect width="${W}" height="${H}" fill="${p.bg}"/>${grid}
 <ellipse cx="${floor[0]}" cy="${(+floor[1]+s*.06).toFixed(1)}" rx="${(s*(w+d)*.62).toFixed(1)}" ry="${(s*(w+d)*.16).toFixed(1)}" fill="#000" opacity=".16" style="filter:blur(6px)"/>
 <g transform="${mA}" clip-path="url(#${id}a)">${art}</g><polygon points="${poly(A)}" fill="url(#${id}s)"/>
 <g transform="${mB}" clip-path="url(#${id}b)">${side}</g><polygon points="${poly(B)}" fill="#000" opacity=".22"/>
 <g transform="${mT}">${top}</g><polygon points="${poly(T)}" fill="#fff" opacity=".12"/>
 <polyline points="${poly([Q(0,h,d),Q(w,h,d),Q(w,h,0)])}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
 <line x1="${Q(w,0,d)[0]}" y1="${Q(w,0,d)[1]}" x2="${Q(w,h,d)[0]}" y2="${Q(w,h,d)[1]}" stroke="#fff" stroke-opacity=".25"/>
 </svg>`;
}

async function optimize(file){

 for(const [max,q] of [[1600,.82],[1200,.74],[900,.68]]){
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  out={data:c.toDataURL("image/webp",q),w:c.width,h:c.height};

}

/* ---------- drag & drop reorder (pointer-free HTML5 DnD + keyboard via buttons) ---------- */
function sortable(container,itemSel,onMove){
 let from=null;
 $$(itemSel,container).forEach(el=>{
  el.draggable=true;
  el.addEventListener("dragstart",e=>{if(ro()){e.preventDefault();return}from=+el.dataset.idx;el.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",from)});
  el.addEventListener("dragend",()=>{el.classList.remove("dragging");$$(".drag-over",container).forEach(x=>x.classList.remove("drag-over"))});
  el.addEventListener("dragover",e=>{e.preventDefault();el.classList.add("drag-over")});
  el.addEventListener("dragleave",()=>el.classList.remove("drag-over"));
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("drag-over");const to=+el.dataset.idx;if(from!=null&&from!==to)onMove(from,to);from=null});
 });
}

 <section class="card"><div class="card-h"><h3>المشاركة (Open Graph)</h3></div><div class="form">${fld("صورة المشاركة",pickHTML("seo.og"),{hint:"1200 × 630 px مثالية."})}<div class="og" id="og"></div></div></section></div>
 <div class="g2"><section class="card"><div class="card-h"><h3>الإعدادات التقنية</h3></div><div class="form">${fld("الرابط الأساسي (Canonical)",inp("seo.canonical",{ltr:1}))}${tgl("السماح بالفهرسة (index)","seo.index")}${tgl("تتبّع الروابط (follow)","seo.follow")}${tgl("توليد خريطة الموقع sitemap.xml","seo.sitemap")}<div class="fld"><span class="lbl">robots meta</span><code class="badge" id="robots"></code></div></div></section>
 <section class="card"><div class="card-h"><h3>ملفات مولّدة</h3><div class="r"><div class="seg" role="group" id="genSeg"><button type="button" data-g="sitemap" aria-pressed="true">sitemap.xml</button><button type="button" data-g="ld" aria-pressed="false">JSON-LD</button></div></div></div><pre class="code" id="gen"></pre></section></div>`;
 let g="sitemap";
 const paint=()=>{const st=S.work.seo,L_=st[S.lang],base=st.canonical.replace(/\/$/,""),og=TPCMS.mediaUrl(st.og);
  $("#serp").innerHTML=`<div class="u">${esc(base.replace(/^https?:\/\//,""))}${S.lang==="en"?" › en":""}</div><div class="t">${esc(L_.title)}</div><div class="d">${esc(L_.desc)}</div>`;
  $("#og").innerHTML=`<div class="im">${og?`<img src="${og}" alt="">`:`<img src="${$("#logoD").src}" alt="" style="width:72px;height:72px;object-fit:contain">`}</div><div class="tx"><span>${esc(base.replace(/^https?:\/\//,""))}</span><b>${esc(L_.title)}</b></div>`;
  $("#robots").textContent=`${st.index?"index":"noindex"}, ${st.follow?"follow":"nofollow"}`;
  const urls=["/","/en/",...S.work.projects.filter(p=>p.status==="published").map(p=>`/work/${p.slug}`)];
  $("#gen").textContent=g==="sitemap"?(st.sitemap?`<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${urls.map(u=>`  <url><loc>${base}${u}</loc></url>`).join("\n")}\n</urlset>`:"<!-- sitemap disabled -->"):JSON.stringify({"@context":"https://schema.org","@type":"Organization",name:S.work.content.en.brand,alternateName:S.work.content.ar.brand,url:base+"/",description:S.work.seo.en.desc,knowsAbout:S.work.content.en.services.items.map(x=>x[1])},null,2)};
 bind(v);bindPicks(v,paint);paint();v.addEventListener("bound",paint);v.addEventListener("change",paint);
 $$("#genSeg button").forEach(b=>b.onclick=()=>{g=b.dataset.g;$$("#genSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));paint()});
}};

/* ====================================================== FORMS (inbox) */
const LSTAT={new:["جديد","acc"],progress:["قيد المتابعة","warn"],done:["مكتمل","ok"],spam:["مزعج","err"]};
const lf={s:"all"};
PAGES.forms={title:"النماذج",render(v){
 v.innerHTML=`${ph("FORMS","النماذج والطلبات","طلبات «لنبدأ مشروعك» الواردة من الموقع مع المرفقات، وإعدادات النموذج.")}
 <div class="split"><section class="card flush"><div class="card-h" style="padding:14px 16px 0"><div class="chips" id="lfs"></div></div><div class="tscroll"><table class="tbl"><thead><tr><th>العميل</th><th>نوع المشروع</th><th>الميزانية</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody id="lBody"></tbody></table></div></section>
 <fieldset class="pg" ${ro()||(!can("settings")?"disabled":"")}><section class="card"><div class="card-h"><h3>إعدادات النموذج</h3></div><div class="form">${fld("إرسال الإشعارات إلى",inp("settings.notify",{ltr:1,type:"email",attrs:' data-cap="settings"'}))}<div class="f2">${fld("حجم الملف الأقصى (MB)",`<input type="number" min="1" max="100" data-k="settings.maxMB" data-t="num" data-cap="settings">`)}${fld("عدد الملفات الأقصى",`<input type="number" min="1" max="20" data-k="settings.maxFiles" data-t="num" data-cap="settings">`)}</div><div class="fld"><span class="lbl">الأنواع المسموحة</span><div class="checks">${["PDF","AI","PSD","ZIP","JPG","PNG","WEBP"].map(x=>`<span class="badge">${x}</span>`).join("")}</div></div><p class="note"><b>الحماية:</b> تحقق من الحقول في المتصفح والخادم، فحص نوع الملف الفعلي، حد للحجم، حقل مخفي ضد البوتات، وحد لعدد الطلبات لكل عنوان IP.</p></div></section></fieldset></div>`;
 bind(v);
 const draw=()=>{const L=leads();
  $("#lfs").innerHTML=[["all","الكل"],...Object.entries(LSTAT).map(([k,x])=>[k,x[0]])].map(([k,t])=>`<button class="chipb" type="button" data-s="${k}" aria-pressed="${lf.s===k}">${t}<sup>${k==="all"?L.length:L.filter(l=>l.status===k).length}</sup></button>`).join("");
  $$("#lfs button").forEach(b=>b.onclick=()=>{lf.s=b.dataset.s;draw()});
  const list=L.filter(l=>lf.s==="all"||l.status===lf.s);
  $("#lBody").innerHTML=list.map(l=>`<tr class="click" data-id="${l.id}"><td><b>${esc(l.name)}</b>${l.demo?` <span class="badge">تجريبي</span>`:""}<div class="muted" style="font-size:.76rem">${esc(l.company||"")}</div></td><td>${esc(l.type||"—")}</td><td class="muted">${esc(l.budget||"—")}</td><td><span class="badge ${LSTAT[l.status][1]}"><i></i>${LSTAT[l.status][0]}</span></td><td class="muted" style="white-space:nowrap">${rel(l.at)}</td></tr>`).join("")||`<tr><td colspan="5"><div class="empty">لا توجد طلبات</div></td></tr>`;
  $$("#lBody tr[data-id]").forEach(r=>r.onclick=()=>openLead(r.dataset.id));
 };
 const openLead=id=>{if(can("edit")){const a=leads(),x=a.find(y=>y.id===id);if(x&&x.status==="new"){x.status="progress";TPCMS.put(K.leads,a);draw();paintSide()}}
  const l=leads().find(x=>x.id===id);if(!l)return;
  drawer(l.name,`<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="badge ${LSTAT[l.status][1]}"><i></i>${LSTAT[l.status][0]}</span><span class="badge">${fmtDate(l.at)}</span>${l.lang?`<span class="badge">${l.lang.toUpperCase()}</span>`:""}</div>
   <table class="tbl"><tbody>${[["الشركة",l.company],["البريد",l.email],["الهاتف",l.phone],["نوع المشروع",l.type],["الميزانية",l.budget]].map(([a,b])=>`<tr><td class="muted">${a}</td><td ${/@|\+/.test(b||"")?'dir="ltr" style="text-align:end"':""}>${esc(b||"—")}</td></tr>`).join("")}</tbody></table>
   <div class="fld"><span class="lbl">تفاصيل المشروع</span><p class="note" style="color:var(--ink);white-space:pre-wrap">${esc(l.msg||"")}</p></div>
   <div class="fld"><span class="lbl">المرفقات (${(l.files||[]).length})</span>${(l.files||[]).map(f=>`<div class="row">${ic("doc",18)}<span class="t"><b class="ltr">${esc(f.name)}</b><span>${fmtBytes(f.size)}</span></span></div>`).join("")||`<span class="muted" style="font-size:.84rem">بدون مرفقات</span>`}</div>
   ${fld("الحالة",`<select id="lSt">${Object.entries(LSTAT).map(([k,x])=>`<option value="${k}" ${l.status===k?"selected":""}>${x[0]}</option>`).join("")}</select>`)}`,
   d=>{$("#lSt",d).onchange=e=>{if(!guard("edit"))return;const a=leads();a.find(x=>x.id===id).status=e.target.value;TPCMS.put(K.leads,a);draw();paintSide();toast("حُدّثت حالة الطلب")};
    $("#lDel",d).onclick=async()=>{if(!guard("delete"))return;if(await confirmBox("حذف الطلب؟","سيُحذف الطلب ومرفقاته نهائياً.","حذف",true)){TPCMS.put(K.leads,leads().filter(x=>x.id!==id));closeDrawer();draw();paintSide()}}},
   `${l.email?`<a class="btn btn-primary btn-sm" href="mailto:${esc(l.email)}?subject=${encodeURIComponent("Titan Pack — "+(l.type||""))}">${ic("mail",14)} رد بالبريد</a>`:""}${l.phone?`<a class="btn btn-ghost btn-sm" href="https://wa.me/${esc(l.phone.replace(/\D/g,""))}" target="_blank" rel="noopener">${ic("wa",14)} واتساب</a>`:""}<button class="btn btn-danger btn-sm" type="button" id="lDel" style="margin-inline-start:auto">${ic("trash",14)}</button>`);
 };
 draw();
}};

PAGES.users={title:"المستخدمون",render(v){

 v.innerHTML=`${ph("USERS & ROLES","المستخدمون والصلاحيات","أربعة أدوار: المالك، المدير، المحرر، المشاهد. الصلاحيات تُفرض في الخادم (API)؛ الواجهة تعكسها فقط.",`<button class="btn btn-primary" type="button" id="uInv">${ic("plus",16)} دعوة مستخدم</button>`)}
 ${!can("users")?`<div class="readonly-bar">${ic("lock",16)} إدارة المستخدمين متاحة للمالك فقط.</div>`:""}
 <section class="card flush"><div class="tscroll"><table class="tbl"><thead><tr><th>المستخدم</th><th>الدور</th><th>آخر نشاط</th><th>الحالة</th></tr></thead><tbody id="uBody"></tbody></table></div></section>
 <section class="card"><div class="card-h"><h3>مصفوفة الصلاحيات</h3></div><div class="tscroll"><table class="tbl perm"><thead><tr><th>الصلاحية</th>${Object.values(ROLES).map(r=>`<th>${r.t}</th>`).join("")}</tr></thead><tbody>${Object.values(CAPS).map(c=>`<tr><td>${c.t}</td>${Object.keys(ROLES).map(r=>`<td class="${c.r.includes(r)?"y":"n"}">${c.r.includes(r)?"✓":"—"}</td>`).join("")}</tr>`).join("")}<tr><td>عرض لوحة التحكم</td>${Object.keys(ROLES).map(()=>`<td class="y">✓</td>`).join("")}</tr></tbody></table></div></section>`;
 const draw=()=>{$("#uBody").innerHTML=U().map(u=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="av" style="width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;color:var(--primary-ink)">${esc(u.name.trim()[0])}</span><div><b>${esc(u.name)}</b>${u.email===S.user.email?` <span class="badge acc">أنت</span>`:""}<div class="muted ltr" style="font-size:.76rem;text-align:start">${esc(u.email)}</div></div></div></td><td><select class="inp" data-u="${u.id}" style="width:auto" ${!can("users")||u.role==="owner"&&U().filter(x=>x.role==="owner").length<2?"disabled":""}>${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${u.role===k?"selected":""}>${r.t}</option>`).join("")}</select></td><td class="muted">${u.pending?"دعوة معلّقة":rel(u.at)}</td><td>${u.pending?`<span class="badge warn"><i></i>مدعو</span>`:u.active?`<span class="badge ok"><i></i>نشط</span>`:`<span class="badge"><i></i>غير نشط</span>`}</td></tr>`).join("");
  $$("[data-u]").forEach(s=>s.onchange=()=>{const a=U();a.find(x=>x.id===s.dataset.u).role=s.value;TPCMS.put(K.users,a);mark(null,"تغيير دور مستخدم");toast("حُدّث الدور")})};
 draw();
 $("#uInv").onclick=async()=>{if(!guard("users"))return;const r=await modal({title:"دعوة مستخدم",body:`<div class="form">${fld("الاسم",`<input id="iN">`)}${fld("البريد الإلكتروني",`<input id="iE" type="email" dir="ltr">`)}${fld("الدور",`<select id="iR">${Object.entries(ROLES).filter(([k])=>k!=="owner").map(([k,x])=>`<option value="${k}">${x.t} — ${x.d}</option>`).join("")}</select>`)}</div>`,actions:[{label:"إلغاء",value:null,cls:"btn-quiet"},{label:"إرسال الدعوة",value:1,cls:"btn-accent",validate:()=>/^\S+@\S+\.\S+$/.test($("#iE").value)&&$("#iN").value.trim()||(toast("أدخل اسماً وبريداً صحيحاً","err"),false)}],read:()=>({name:$("#iN").value.trim(),email:$("#iE").value.trim(),role:$("#iR").value})});
  if(r){const a=U();a.push({id:uid("u"),...r.read,at:Date.now(),pending:true});TPCMS.put(K.users,a);mark(null,`دعوة ${r.read.name}`);draw();toast("أُرسلت الدعوة (محاكاة)","ok")}};
}};

PAGES.settings={title:"الإعدادات",lang:true,render(v){

 v.innerHTML=`${ph("SETTINGS","الإعدادات العامة","اسم العلامة، اللغات، بيانات التواصل التي تظهر في الموقع، والنسخ الاحتياطي.")}${!can("settings")?`<div class="readonly-bar">${ic("lock",16)} الإعدادات متاحة للمالك فقط.</div>`:""}
 <fieldset class="pg" ${!can("settings")?"disabled":""}><div class="g2"><section class="card"><div class="card-h"><h3>العلامة واللغات</h3></div><div class="form"><div class="f2">${fld("الاسم بالعربية",inp("content.ar.brand",{attrs:' data-cap="settings"'}))}${fld("Name in English",inp("content.en.brand",{attrs:' data-cap="settings"'}))}</div>${fld("اللغة الافتراضية",`<select data-k="settings.defaultLang" data-cap="settings"><option value="ar">العربية (RTL)</option><option value="en">English (LTR)</option></select>`)}${tgl("تفعيل النسخة الإنجليزية","settings.en",{cap:"settings"})}</div></section>
 <section class="card"><div class="card-h"><h3>بيانات التواصل</h3>${langNote()}</div><div class="form">${ci.map((r,i)=>fld(r[0],inp(`content.{L}.contact.info.${i}.1`,{attrs:' data-cap="settings"',ltr:i<2?1:0,sync:i<2?`content.{O}.contact.info.${i}.1`:""}))).join("")}<p class="note">البريد وواتساب مشتركان بين اللغتين؛ الموقع والساعات تُكتب لكل لغة.</p></div></section></div>
 <div class="g2" style="margin-top:20px"><section class="card"><div class="card-h"><h3>نسخة احتياطية</h3></div><p class="muted" style="font-size:.86rem;margin-bottom:12px">صدّر المسودة الحالية كملف JSON أو استورد نسخة سابقة (تُحمَّل كمسودة ولا تُنشر تلقائياً).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" type="button" id="exp">${ic("upload",16)} تصدير JSON</button><label class="btn btn-ghost" style="cursor:pointer">${ic("doc",16)} استيراد<input type="file" id="imp" accept=".json,application/json" hidden></label></div></section>
 <section class="card" style="border-color:color-mix(in srgb,var(--error) 40%,transparent)"><div class="card-h"><h3 style="color:var(--error)">منطقة الخطر</h3></div><p class="muted" style="font-size:.86rem;margin-bottom:12px">إعادة ضبط بيانات النموذج في هذا المتصفح: المسودات والإصدارات والوسائط والطلبات.</p><button class="btn btn-danger" type="button" id="wipe">${ic("trash",16)} إعادة ضبط النموذج</button></section></div></fieldset>`;

 $("#wipe").onclick=async()=>{if(!guard("settings"))return;if(await confirmBox("إعادة ضبط النموذج؟","يحذف كل بيانات لوحة التحكم المحفوظة في هذا المتصفح ويعيد المحتوى الأصلي. لا يمكن التراجع.","إعادة الضبط",true)){Object.values(K).concat(["tp-cms-meta","tp-cms-folders","tp-theme","tp-bg"]).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});location.reload()}};
}};

/* Titan Pack dashboard — AI assistant (prototype).
   Intents are matched locally so the flow can be tested offline; in the platform the same panel sends the request
   plus a CMS schema summary to Claude through the API, which returns the same kind of plan: small edits run with
   an undo, structural or large edits wait for confirmation. */
const AI_SUG=["اجعل الموقع أكثر فخامة","غيّر اللون الأساسي إلى الأسود","أضف هذا المشروع إلى المعرض","اكتب وصفاً احترافياً لهذا المشروع","أنشئ قسم جديد للخدمات","أخفِ قسم الفيديو"];
const aiMsgs=[];const aiActs={};
const norm=s=>s.toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي");
const COLOR_WORDS=[[/اسود|black/,"#1B1B1B","الأسود"],[/كحلي|navy|ازرق|blue/,"#23395B","الأزرق الداكن"],[/اخضر|زيتي|green|olive/,"#3E5641","الأخضر الزيتوني"],[/خمري|عنابي|احمر|burgundy|red/,"#6B2D3C","الخمري"],[/بني|brown/,"#5A3A22","البني"],[/ذهبي|gold/,"#C9A45C","الذهبي"],[/برتقالي|orange/,"#EF974F","البرتقالي"],[/فيروزي|تركواز|teal|turquoise/,"#1E8AA0","الفيروزي"],[/بنفسجي|purple/,"#4B3869","البنفسجي"]];

const SEC_WORDS=[[/خدمات|خدمه|service/,"services","الخدمات"],[/فريق|team/,"team","الفريق"],[/اراء|اقتباس|testimonial/,"testimonials","آراء العملاء"],[/ارقام|احصائيات|stat/,"stats","الأرقام"],[/فيديو|video/,"video","الفيديو"],[/معرض|gallery/,"gallery","المعرض"],[/شعارات|عملاء|logo/,"logos","شعارات العملاء"],[/تواصل|contact/,"contact","تواصل"],[/مراحل|خط زمني|timeline|process/,"timeline","المراحل"],[/قبل|before/,"beforeafter","قبل / بعد"],[/نص|text/,"text","نص"]];
const SEC_IDS=[[/الواجهه|hero/,"hero"],[/من نحن|about/,"about"],[/الفريق|team/,"team"],[/الخدمات|services/,"services"],[/مختار|featured/,"featured"],[/المعرض|gallery|work/,"work"],[/المراحل|process/,"process"],[/الخامات|materials/,"materials"],[/قبل|before/,"ba"],[/الفيديو|video/,"video"],[/الارقام|stats/,"stats"],[/الاراء|testimonial/,"testimonials"],[/دعوه|cta/,"cta"],[/تواصل|contact/,"contact"]];

function ctxProject(){if(S.route==="projects"&&S.args[0]&&S.args[0]!=="new")return S.work.projects.find(p=>p.id===S.args[0]);return null}
function withUndo(label,fn,cap){const before=clone(S.work);if(!edit(fn,cap))return null;mark(null,"المساعد: "+label);const id=uid("u");aiActs[id]=()=>{S.work=before;TPCMS.put(K.work,S.work);toast("تم التراجع");render();openAI()};return id}
function describe(p){
 const l=S.lang,c=S.work.content[l],t=ptxt(p,l),cat=(c.cats||{})[p.cat]||p.cat,mat=c.materials.mats[p.meta.mat][0],fins=p.meta.fin.map(f=>c.materials.fins[f][0]),svc=p.meta.svc.map(i=>(c.services.items[i]||[])[1]).filter(Boolean);
 const join=(a,and)=>a.length<2?a.join(""):a.slice(0,-1).join("، ")+` ${and} `+a[a.length-1];
 return l==="ar"?`${t[0]}${t[1]?` لصالح ${t[1]}`:""}: عبوة في قطاع ${cat} بمقاس ${p.dims} مم، نُفذت على ${mat}${fins.length?` مع ${join(fins,"و")}`:""}. شمل العمل ${join(svc,"و")||"التصميم الكامل"}، لتخرج عبوة تُقرأ بوضوح على الرف وتصل إلى المطبعة بملفات جاهزة دون تعديلات.`
  :`${t[0]}${t[1]?` for ${t[1]}`:""}: a ${cat.toLowerCase()} pack at ${p.dims} mm, produced on ${mat}${fins.length?` with ${join(fins.map(x=>x.toLowerCase()),"and")}`:""}. The scope covered ${join(svc.map(x=>x.toLowerCase()),"and")||"end-to-end design"}, delivering a pack that reads clearly on shelf and reaches the printer with production-ready files.`;
}
function think(raw){
 const q=norm(raw),T=S.work.theme;
 // colour
 if(/لون|color|colour/.test(q)){
  const hex=(raw.match(/#[0-9a-f]{6}/i)||[])[0],w=COLOR_WORDS.find(([r])=>r.test(q)),key=/مميز|accent|ثانوي|الازرار/.test(q)?"accent":"primary";
  const val=hex||(w&&w[1]),old=T[key];if(!val)return{t:"أي لون تقصد؟ اكتب اسم اللون (أسود، كحلي، زيتوني، خمري…) أو رمزه مثل ‎#1B1B1B."};
  if(!can("theme"))return{t:`اقتراح: ${key==="primary"?"اللون الأساسي":"اللون المميز"} ← ${val}. صلاحيتك لا تسمح بتعديل الهوية؛ اطلب من المالك أو المدير.`};
  const id=withUndo(`تغيير ${key==="primary"?"اللون الأساسي":"اللون المميز"}`,x=>x.theme[key]=val,"theme");if(!id)return{t:"لم يتم التنفيذ."};
  if(key==="primary")mark("primary");
  return{t:`تم. ${key==="primary"?"اللون الأساسي":"اللون المميز"} الآن ${w?w[2]:""} <span class="ltr">${val}</span> في المسودة، والمعاينة تحدّثت.`,plan:{items:[`${key==="primary"?"الأساسي":"المميز"}: <span class="ltr">${old}</span> ← <span class="ltr" style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${val};vertical-align:middle"></span> <span class="ltr">${val}</span>`],acts:[["تراجع",id,"btn-ghost"],["افتح الثيم","go:theme","btn-quiet"]]}};
 }
 // luxury preset — large change → confirm
 if(/فخام|فخم|راقي|luxur|premium|elegant/.test(q)){
  const p=THEME_PRESETS[1][2],id=uid("a");
  aiActs[id]=()=>{const u=withUndo("تطبيق هوية فاخرة",x=>Object.assign(x.theme,p),"theme");if(!u)return;mark("primary");mark("font");say({t:"طُبّقت الهوية الفاخرة على المسودة. راجع المعاينة، ثم احفظ المسودة وانشر عندما تكون جاهزاً.",plan:{items:[],acts:[["تراجع",u,"btn-ghost"],["عرض في الثيم","go:theme","btn-quiet"]]}})};
  return{t:"اقتراحي لإحساس أكثر فخامة يناسب علب الهدايا والعطور:",plan:{items:[`اللون الأساسي أسود فحمي <span class="ltr">${p.primary}</span> والمميز ذهبي <span class="ltr">${p.accent}</span>`,`خلفية عاجية دافئة <span class="ltr">${p.bg}</span> وسطح <span class="ltr">${p.surface}</span>`,`خط العناوين «${p.font}» بوزن ${p.headWeight}`,"أزرار حادة الزوايا واستدارة 4px للبطاقات"],warn:`تغيير كبير: ${Object.keys(p).length} إعدادات في الهوية — يحتاج تأكيدك.`,acts:can("theme")?[["تأكيد التطبيق",id,"btn-accent"],["إلغاء","noop","btn-quiet"]]:[["صلاحيتك لا تسمح","noop","btn-quiet"]]}};
 }
 // font
 if(/خط|font/.test(q)){const f=FONT_WORDS.find(([r])=>r.test(q));if(!f)return{t:`الخطوط المتاحة: ${FONTS.join("، ")}. أي خط تريد للعناوين؟`};const id=withUndo(`خط العناوين ${f[1]}`,x=>x.theme.font=f[1],"theme");if(!id)return{t:"لم يتم التنفيذ."};mark("font");return{t:`تم تغيير خط العناوين إلى «${f[1]}».`,plan:{items:[],acts:[["تراجع",id,"btn-ghost"]]}}}
 // project description
 if(/وصف|describe|description/.test(q)){
  const p=ctxProject();
  if(!p){const recent=S.work.projects.slice(0,3);return{t:"افتح المشروع الذي تريد وصفه ثم اطلب مرة أخرى، أو اختر واحداً:",plan:{items:[],acts:recent.map(r=>[ptxt(r,"ar")[0],"go:projects/"+r.id,"btn-ghost"])}}}
  const txt=describe(p),id=uid("a");
  aiActs[id]=()=>{const u=withUndo("كتابة وصف مشروع",x=>x.content[S.lang].proj[p.id][2]=txt,"projects");if(u){say({t:"أُدرج الوصف في المشروع.",plan:{items:[],acts:[["تراجع",u,"btn-ghost"]]}});render();openAI()}};
  return{t:`مسودة وصف لـ«${ptxt(p)[0]}» (${LN[S.lang]}) مبنية على بيانات المشروع:`,plan:{items:[`<span style="white-space:normal">${esc(txt)}</span>`],acts:[["إدراج في الوصف",id,"btn-accent"],["نسخ","copy:"+txt,"btn-quiet"]]}};
 }
 // add / publish project to gallery
 if(/مشروع|project/.test(q)&&/اضف|انشر|المعرض|add|gallery|publish/.test(q)){
  const p=ctxProject();
  if(!p)return{t:"لإضافة مشروع جديد: أنشئه كمسودة وأكمل بياناته، ثم اطلب مني نشره في المعرض.",plan:{items:[],acts:[["إنشاء مشروع","go:projects/new","btn-accent"]]}};
  const feat=/مميز|مختار|featured/.test(q);

  render();return{t:`تم. «${ptxt(p)[0]}» أصبح «منشوراً» في المسودة${feat?" وضمن المشاريع المختارة":""} ويظهر في المعرض بعد النشر.`,plan:{items:[],acts:[["تراجع",id,"btn-ghost"],["نشر الآن","publish","btn-accent"]]}};
 }
 // hide / show a section
 if(/اخف|اخفي|hide|اظهر|show/.test(q)){
  const m=SEC_IDS.find(([r])=>r.test(q));if(!m)return{t:"أي قسم؟ مثال: «أخفِ قسم الفيديو» أو «أظهر قسم الآراء»."};
  const show=/اظهر|show/.test(q),id=withUndo(`${show?"إظهار":"إخفاء"} قسم`,x=>x.sections.find(s=>s.id===m[1]).visible=show);if(!id)return{t:"لم يتم التنفيذ."};
  pvScroll(m[1]);if(S.route==="sections")render();
  return{t:`تم ${show?"إظهار":"إخفاء"} قسم «${secLabel(m[1])}» في المسودة.`,plan:{items:[],acts:[["تراجع",id,"btn-ghost"]]}};
 }
 // new section — structural → confirm
 if(/قسم|section/.test(q)&&/جديد|انشئ|اضف|new|add|create/.test(q)){
  const t=SEC_WORDS.find(([r])=>r.test(q))||[,"custom","مخصص"],id=uid("a");
  const copy=t[1]==="services"?{ar:{eyebrow:"خدمات إضافية",h2:"خدمات تكمل مشروع عبوتك",p:"تصوير المنتج، كتابة نصوص العبوة، وتجهيز صور المتجر الإلكتروني — بنفس جودة التصميم.",btn:"اطلب الخدمة",href:"#contact"},en:{eyebrow:"Extra services",h2:"Services that complete your pack",p:"Product photography, on-pack copywriting and e-commerce imagery — at the same design standard.",btn:"Request",href:"#contact"}}:{ar:{eyebrow:t[2],h2:`قسم ${t[2]} جديد`,p:"اكتب هنا وصفاً قصيراً لهذا القسم.",btn:"",href:"#contact"},en:{eyebrow:t[1],h2:`New ${t[1]} section`,p:"Write a short description for this section.",btn:"",href:"#contact"}};
  aiActs[id]=()=>{const nid=uid("cs-");const u=withUndo("إنشاء قسم",x=>{const at=x.sections.findIndex(s=>s.id==="cta");x.sections.splice(at<0?x.sections.length:at,0,{id:nid,visible:true,custom:{type:t[1],image:null,...clone(copy)}})});if(!u)return;mark("sectionAdd");location.hash="#/sections/"+nid;say({t:"أُضيف القسم قبل «دعوة للعمل» وفتحته للتعديل.",plan:{items:[],acts:[["تراجع",u,"btn-ghost"]]}})};
  return{t:`سأضيف قسماً من نوع «${t[2]}» بمحتوى مبدئي:`,plan:{items:[`العنوان: ${esc(copy.ar.h2)}`,`النص: ${esc(copy.ar.p)}`,"الموضع: قبل قسم «دعوة للعمل» — نسخة عربية وإنجليزية"],warn:"تغيير في هيكل الصفحة — يحتاج تأكيدك.",acts:[["تأكيد الإنشاء",id,"btn-accent"],["إلغاء","noop","btn-quiet"]]}};
 }
 if(/انشر|publish/.test(q))return{t:"سأفتح نافذة النشر لتراجع التغييرات قبل وصولها للموقع.",plan:{items:[],acts:[["مراجعة ونشر","publish","btn-accent"]]}};
 return{t:"أستطيع تنفيذ أوامر مثل:",plan:{items:["تغيير الألوان والخطوط: «غيّر اللون الأساسي إلى الكحلي»","اقتراح هوية كاملة: «اجعل الموقع أكثر فخامة»","كتابة وصف مشروع مفتوح: «اكتب وصفاً احترافياً لهذا المشروع»","نشر مشروع في المعرض: «أضف هذا المشروع إلى المعرض»","الأقسام: «أنشئ قسم جديد للخدمات» · «أخفِ قسم الفيديو»"],acts:[]}};
}
function say(m){aiMsgs.push({r:"a",...m});paintAI()}
function aiSend(text){text=text.trim();if(!text)return;aiMsgs.push({r:"u",t:esc(text)});aiMsgs.push({r:"a",typing:1});paintAI();
 setTimeout(()=>{aiMsgs.pop();let res;try{res=think(text)}catch(e){res={t:"حدث خطأ أثناء تنفيذ الطلب."}}aiMsgs.push({r:"a",...res});paintAI()},450)}
function paintAI(){
 const log=$("#aiLog");if(!log)return;
 log.innerHTML=aiMsgs.map(m=>`<div class="msg ${m.r}">${m.typing?`<span class="typing"><i></i><i></i><i></i></span>`:m.t}${m.plan?`<div class="plan">${m.plan.items.length?`<ul>${m.plan.items.map(i=>`<li>${i}</li>`).join("")}</ul>`:""}${m.plan.warn?`<span class="warn">${ic("lock",12)} ${m.plan.warn}</span>`:""}${m.plan.acts.length?`<div class="acts">${m.plan.acts.map(([l,a,c])=>`<button class="btn btn-sm ${c}" type="button" data-ai="${esc(a)}">${esc(l)}</button>`).join("")}</div>`:""}</div>`:""}</div>`).join("");
 log.scrollTop=log.scrollHeight;
 $$("[data-ai]",log).forEach(b=>b.onclick=()=>{const a=b.dataset.ai;b.closest(".acts").querySelectorAll("button").forEach(x=>x.disabled=true);
  if(a==="noop")return say({t:"حسناً، لم أغيّر شيئاً."});
  if(a==="publish")return publish();
  if(a.startsWith("go:")){location.hash="#/"+a.slice(3);return}
  if(a.startsWith("copy:")){navigator.clipboard&&navigator.clipboard.writeText(a.slice(5)).then(()=>toast("نُسخ النص"));return}
  aiActs[a]&&aiActs[a]()});
}
function openAI(){
 const p=$("#ai");p.hidden=false;
 if(!aiMsgs.length)aiMsgs.push({r:"a",t:`أهلاً ${esc(S.user.name.split(" ")[0])}، أنا مساعد تيتان باك. أعدّل المسودة فقط — لا شيء يصل للموقع قبل النشر، والتغييرات الكبيرة أطلب تأكيدك عليها.`});
 p.innerHTML=`<div class="ai-h"><span class="spark">${ic("spark",18)}</span><div><b>المساعد الذكي</b><small>نموذج تجريبي · يفهم أوامر محددة محلياً</small></div><button class="icon-btn sm" type="button" id="aiX" aria-label="إغلاق">${ic("x",16)}</button></div>
 <div class="ai-log" id="aiLog" aria-live="polite"></div><div class="ai-sug">${AI_SUG.map(s=>`<button type="button">${s}</button>`).join("")}</div>
 <form class="ai-f" id="aiF"><textarea id="aiIn" placeholder="اطلب تعديلاً… مثال: غيّر اللون الأساسي إلى الكحلي" aria-label="رسالة للمساعد"></textarea><button class="btn btn-accent" type="submit" aria-label="إرسال">${ic("send",16)}</button></form>`;
 $("#aiX").onclick=closeAI;
 $$(".ai-sug button",p).forEach(b=>b.onclick=()=>aiSend(b.textContent));
 $("#aiF").onsubmit=e=>{e.preventDefault();aiSend($("#aiIn").value);$("#aiIn").value=""};
 $("#aiIn").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#aiF").requestSubmit()}};
 paintAI();$("#aiIn").focus();
}
function closeAI(){$("#ai").hidden=true}

boot();
</script>

</body>
</html>
