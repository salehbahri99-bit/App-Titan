<script>try{var l=localStorage.getItem("tp-lang");document.documentElement.dir=l==="en"?"ltr":"rtl";document.documentElement.lang=l==="en"?"en":"ar"}catch(e){document.documentElement.dir="rtl";document.documentElement.lang="ar"}</script>
<a id="top"></a>
<header class="hdr"><div class="wrap">
  <a class="brand" href="#top"><img id="logoSrc" class="logo-l" src="data:image/png;base64,/*LOGO_L*/" alt="Titan Pack" width="40" height="40"><img id="logoDark" class="logo-d" src="data:image/png;base64,/*LOGO_D*/" alt="Titan Pack" width="40" height="40"><span><b class="brand-name">تيتان باك</b><small>TITAN PACK</small></span></a>
  <nav class="nav" id="nav" aria-label="main"></nav>
  <div class="hdr-tools">

    <a class="btn btn-accent" id="navCta" href="#contact">ابدأ مشروعك</a>
    <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>

</div></header>

  <section class="contact" id="contact"></section>

<footer class="ftr"><div class="wrap"><div class="ftr-top" id="ftrCols"></div><div class="ftr-bot" id="ftrBot"></div></div></footer>
