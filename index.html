<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan Print — قسم التصميم</title>
<style>
  :root{
    --topbar:#0d3b3f;
    --nav:#3d3a36;
    --pill:#4b4642;
    --pill-hover:#5a5551;
    --orange:#e8873a;
    --orange-dark:#d4762c;
    --cream:#f7edd6;
    --ink:#2f2b28;
    --muted:#8a8178;
    --white:#ffffff;
    --shadow:0 2px 8px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;
    background:var(--cream);
    color:var(--ink);
  }

  /* ---------- الشريط العلوي ---------- */
  .topbar{
    background:var(--topbar);
    color:#e9f2f1;
    padding:6px 20px;
    display:flex;
    justify-content:flex-end;
    font-size:13px;
    letter-spacing:.3px;
  }

  /* ---------- شريط التنقل ---------- */
  .nav{
    background:var(--nav);
    padding:16px 20px 22px;
    border-bottom:3px solid var(--orange);
  }
  .nav-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:12px;
  }
  .nav-row:last-child{margin-bottom:0}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--pill);
    color:#f0ece7;
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-size:15px;
    font-family:inherit;
    text-decoration:none;
    cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .pill:hover{background:var(--pill-hover)}
  .pill.active{background:var(--orange);color:#fff}
  .pill.active:hover{background:var(--orange-dark)}
  .pill svg{width:17px;height:17px;flex:none}

  /* ---------- المحتوى ---------- */
  .content{padding:26px 24px 60px}
  .page-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
  }

  .search-box{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    margin-bottom:22px;
  }
  .search-box .label{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
  }
  .search-box .label svg{width:19px;height:19px;color:var(--orange)}
  .chev{color:var(--muted);font-size:13px}

  /* ---------- صفوف الفلاتر ---------- */
  .filter-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .segmented{
    display:inline-flex;
    gap:8px;
    background:var(--white);
    border-radius:999px;
    box-shadow:var(--shadow);
    padding:7px;
  }
  .seg-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:none;
    border-radius:999px;
    padding:9px 18px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
    white-space:nowrap;
  }
  .seg-btn:hover{background:#f2ede6}
  .seg-btn.active{background:var(--orange);color:#fff}
  .seg-btn.active:hover{background:var(--orange-dark)}
  .seg-btn svg{width:16px;height:16px;flex:none}
  .count{
    background:rgba(0,0,0,.08);
    border-radius:999px;
    padding:1px 8px;
    font-size:12px;
  }
  .seg-btn.active .count{background:rgba(255,255,255,.28)}

  /* ---------- قائمة الطلبات ---------- */
  .orders{
    margin-top:22px;
    display:grid;
    gap:12px;
  }
  .order{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-inline-start:5px solid var(--orange);
  }
  .order .meta{display:flex;flex-direction:column;gap:4px}
  .order .name{font-size:16px;font-weight:600}
  .order .sub{font-size:13px;color:var(--muted)}
  .order .date{font-size:13px;color:var(--muted)}

  /* ---------- بطاقة الطلب (التفاصيل) ---------- */
  .order{cursor:pointer;transition:box-shadow .15s ease,transform .15s ease}
  .order:hover{box-shadow:0 4px 14px rgba(0,0,0,.12)}

  .card-head{
    background:var(--topbar);
    color:#fff;
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .card-head .title{font-size:20px;font-weight:700}
  .card-head .title .oid{color:var(--orange)}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--pill);
    color:#f0ece7;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease;
  }
  .back-btn:hover{background:var(--pill-hover)}
  .badge{
    background:var(--pill);
    color:#f0ece7;
    border-radius:8px;
    padding:5px 14px;
    font-size:13px;
  }

  .actions{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
  }
  .action{
    background:var(--white);
    border:none;
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:18px 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .action:hover{background:#fdf8ef;transform:translateY(-2px)}
  .action svg{width:22px;height:22px;color:var(--topbar)}
  .action.copy svg{color:var(--orange)}
  .action.copied{background:#e8f5e9}
  .action.copied svg{color:#2e7d32}

  .panel{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 20px;
    margin-top:14px;
  }
  .panel-title{
    font-size:16px;
    font-weight:700;
    color:var(--topbar);
    margin-bottom:14px;
  }
  .fields{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:14px;
    text-align:center;
  }
  .field .k{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field .v{display:block;font-size:15px}

  .toast{
    position:fixed;
    inset-inline:0;
    bottom:24px;
    margin:auto;
    width:max-content;
    max-width:90vw;
    background:var(--topbar);
    color:#fff;
    border-radius:999px;
    padding:12px 26px;
    font-size:15px;
    box-shadow:0 6px 20px rgba(0,0,0,.22);
    opacity:0;
    transform:translateY(12px);
    transition:opacity .2s ease,transform .2s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}

  @media (max-width:640px){
    .segmented{width:100%;justify-content:center;flex-wrap:wrap}
    .filter-row{justify-content:stretch}
  }
</style>
</head>

    { id: 1039, customer: "أحمد الزهراني",  type: "other",   status: "active", createdAt: "2026-08-10",
      phone: "0509876543", address: "جدة ـ الحمراء",    pieces: 6,  total: 320,  delivery: 35 },
    { id: 1035, customer: "متجر الواحة",    type: "clothes", status: "active", createdAt: "2026-08-04",
      phone: "0533344556", address: "الدمام ـ الفيصلية", pieces: 40, total: 2100, delivery: 80 },
    { id: 1028, customer: "شركة الأفق",     type: "other",   status: "done",   createdAt: "2026-07-27",
      phone: "0566677889", address: "مكة ـ العزيزية",   pieces: 15, total: 890,  delivery: 50 },
    { id: 1022, customer: "نادي الرواد",    type: "clothes", status: "active", createdAt: "2026-07-19",
      phone: "0577788990", address: "الطائف ـ الشهار",  pieces: 30, total: 1650, delivery: 60 },
    { id: 1014, customer: "سالم القحطاني",  type: "clothes", status: "done",   createdAt: "2026-07-02",
      phone: "0512233445", address: "أبها ـ المنسك",    pieces: 8,  total: 410,  delivery: 45 }
  ];

  const CURRENCY = "₪";

  const state = { type: "all", sort: "newest", status: "active" };

  const TYPE_LABEL   = { clothes: "ملابس", other: "منتج آخر" };
  const STATUS_LABEL = { active: "نشط", done: "منفذ" };

  function bindSegment(containerId, key) {
    const container = document.getElementById(containerId);
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".seg-btn");
      if (!btn) return;
      container.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset[key];
      render();
    });
  }

  function render() {
    const list = ORDERS
      .filter(o => state.type === "all" || o.type === state.type)
      .filter(o => o.status === state.status)
      .sort((a, b) => state.sort === "newest"
        ? new Date(b.createdAt) - new Date(a.createdAt)   // الأحدث أولاً
        : new Date(a.createdAt) - new Date(b.createdAt)); // الأقدم أولاً

    const el = document.getElementById("ordersList");

    if (!list.length) {
      el.innerHTML = '<div class="order"><span class="sub">لا توجد طلبات مطابقة</span></div>';
      return;
    }

    el.innerHTML = list.map(o => `
      <div class="order" data-id="${o.id}" role="button" tabindex="0">
        <div class="meta">
          <span class="name">${o.customer}</span>
          <span class="sub">طلب رقم #${o.id} — ${TYPE_LABEL[o.type]} — ${STATUS_LABEL[o.status]}</span>
        </div>
        <span class="date">${o.createdAt}</span>
      </div>
    `).join("");
  }

  /* ---------- بطاقة الطلب ---------- */

  const money = n => `${n} ${CURRENCY}`;

  // النص الذي يُنسخ عند الضغط على زر «نسخ البيانات»
  function orderText(o) {
    return [
      `الاسم: ${o.customer}`,
      `الجوال: ${o.phone}`,
      `العنوان: ${o.address}`,
      `المبلغ: ${money(o.total)}`,
      `التوصيل: ${money(o.delivery)}`
    ].join("\n");
  }

  let currentOrder = null;

  function openOrder(id) {
    const o = ORDERS.find(x => x.id === Number(id));
    if (!o) return;
    currentOrder = o;

    document.getElementById("dCustomer").textContent   = o.customer;
    document.getElementById("dId").textContent         = `#${o.id}`;
    document.getElementById("dStatus").textContent     = STATUS_LABEL[o.status];
    document.getElementById("dStatusText").textContent = STATUS_LABEL[o.status];
    document.getElementById("dPhone").textContent      = o.phone;
    document.getElementById("dAddress").textContent    = o.address;
    document.getElementById("dPieces").textContent     = `${o.pieces} قطعة`;
    document.getElementById("dTotal").textContent      = money(o.total);
    document.getElementById("dDelivery").textContent   = money(o.delivery);
    document.getElementById("dDate").textContent       = o.createdAt;

    resetCopyBtn();
    document.getElementById("listView").hidden   = true;
    document.getElementById("detailView").hidden = false;
    window.scrollTo(0, 0);
  }

  function closeOrder() {
    currentOrder = null;
    document.getElementById("detailView").hidden = true;
    document.getElementById("listView").hidden   = false;
  }

  document.getElementById("ordersList").addEventListener("click", (e) => {
    const card = e.target.closest(".order[data-id]");
    if (card) openOrder(card.dataset.id);
  });

  document.getElementById("ordersList").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const card = e.target.closest(".order[data-id]");
    if (!card) return;
    e.preventDefault();
    openOrder(card.dataset.id);
  });

  document.getElementById("backBtn").addEventListener("click", closeOrder);

  /* ---------- النسخ ---------- */

  let toastTimer = null;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2000);
  }

  let copyTimer = null;
  function resetCopyBtn() {
    clearTimeout(copyTimer);
    document.getElementById("copyBtn").classList.remove("copied");
    document.getElementById("copyLabel").textContent = "نسخ البيانات";
  }

  // navigator.clipboard غير متاح على http أو في متصفحات قديمة — نرجع لطريقة textarea
  async function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) { /* نكمل بالطريقة البديلة */ }
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.getElementById("copyBtn").addEventListener("click", async () => {
    if (!currentOrder) return;
    const ok = await copyText(orderText(currentOrder));
    if (!ok) {
      toast("تعذّر النسخ — انسخ البيانات يدوياً");
      return;
    }
    const btn = document.getElementById("copyBtn");
    btn.classList.add("copied");
    document.getElementById("copyLabel").textContent = "تم النسخ ✓";
    clearTimeout(copyTimer);
    copyTimer = setTimeout(resetCopyBtn, 2000);
    toast("تم نسخ الاسم والجوال والعنوان والمبلغ والتوصيل");
  });

  bindSegment("typeFilter", "type");
  bindSegment("sortFilter", "sort");
  bindSegment("statusFilter", "status");
  render();
</script>

</body>
</html>
