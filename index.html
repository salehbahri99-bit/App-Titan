<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titan Print — قسم التصميم</title>
<style>
  :root{
    --topbar:#0d3b3f;
    --nav:#3d3a36;
    --pill:#4b4642;
    --pill-hover:#5a5551;
    --orange:#e8873a;
    --orange-dark:#d4762c;
    --cream:#f7edd6;
    --ink:#2f2b28;
    --muted:#8a8178;
    --white:#ffffff;
    --shadow:0 2px 8px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Kufi Arabic",sans-serif;
    background:var(--cream);
    color:var(--ink);
  }

  /* ---------- الشريط العلوي ---------- */
  .topbar{
    background:var(--topbar);
    color:#e9f2f1;
    padding:6px 20px;
    display:flex;
    justify-content:flex-end;
    font-size:13px;
    letter-spacing:.3px;
  }

  /* ---------- شريط التنقل ---------- */
  .nav{
    background:var(--nav);
    padding:16px 20px 22px;
    border-bottom:3px solid var(--orange);
  }
  .nav-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:12px;
  }
  .nav-row:last-child{margin-bottom:0}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--pill);
    color:#f0ece7;
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease,transform .15s ease;
  }
  .pill:hover{background:var(--pill-hover)}
  .pill.active{background:var(--orange);color:#fff}
  .pill.active:hover{background:var(--orange-dark)}
  .pill svg{width:17px;height:17px;flex:none}

  /* ---------- المحتوى ---------- */
  .content{padding:26px 24px 60px}
  .page-title{
    font-size:26px;
    font-weight:700;
    margin-bottom:20px;
  }

  .search-box{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    margin-bottom:22px;
  }
  .search-box .label{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
  }
  .search-box .label svg{width:19px;height:19px;color:var(--orange)}
  .chev{color:var(--muted);font-size:13px}

  /* ---------- صفوف الفلاتر ---------- */
  .filter-row{
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .segmented{
    display:inline-flex;
    gap:8px;
    background:var(--white);
    border-radius:999px;
    box-shadow:var(--shadow);
    padding:7px;
  }
  .seg-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:transparent;
    border:none;
    border-radius:999px;
    padding:9px 18px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    cursor:pointer;
    transition:background .15s ease,color .15s ease;
    white-space:nowrap;
  }
  .seg-btn:hover{background:#f2ede6}
  .seg-btn.active{background:var(--orange);color:#fff}
  .seg-btn.active:hover{background:var(--orange-dark)}
  .seg-btn svg{width:16px;height:16px;flex:none}
  .count{
    background:rgba(0,0,0,.08);
    border-radius:999px;
    padding:1px 8px;
    font-size:12px;
  }
  .seg-btn.active .count{background:rgba(255,255,255,.28)}

  /* ---------- قائمة الطلبات ---------- */
  .orders{
    margin-top:22px;
    display:grid;
    gap:12px;
  }
  .order{
    background:var(--white);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-inline-start:5px solid var(--orange);
  }
  .order .meta{display:flex;flex-direction:column;gap:4px}
  .order .name{font-size:16px;font-weight:600}
  .order .sub{font-size:13px;color:var(--muted)}
  .order .date{font-size:13px;color:var(--muted)}

  @media (max-width:640px){
    .segmented{width:100%;justify-content:center;flex-wrap:wrap}
    .filter-row{justify-content:stretch}
  }
</style>
</head>
<body>

<div class="topbar">Titan Print</div>

<nav class="nav">
  <div class="nav-row">
    <button class="pill active" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg>
      تصميم
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
      طباعة
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      متابعة
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      تواصل
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      إعدادات
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      الأقسام ▴
    </button>
  </div>

  <div class="nav-row">
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      لوحة
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      كل الطلبات
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      الجدولة
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
      الزبائن
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      المحاسبة
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
      المخزون
    </button>
    <button class="pill" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
      طلب ذكي
    </button>
  </div>
</nav>

<main class="content">
  <h1 class="page-title">الطلبات</h1>

  <div class="search-box">
    <span class="label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      البحث والفلاتر
    </span>
    <span class="chev">▾</span>
  </div>

  <!-- فلتر النوع -->
  <div class="filter-row">
    <div class="segmented" id="typeFilter">
      <button class="seg-btn active" type="button" data-type="all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        الكل <span class="count">14</span>
      </button>
      <button class="seg-btn" type="button" data-type="clothes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        ملابس <span class="count">10</span>
      </button>
      <button class="seg-btn" type="button" data-type="other">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05M12 22.08V12"/></svg>
        منتج آخر <span class="count">7</span>
      </button>
    </div>
  </div>

  <!-- فلتر الترتيب: الأحدث / الأقدم -->
  <div class="filter-row">
    <div class="segmented" id="sortFilter">
      <button class="seg-btn active" type="button" data-sort="newest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        الأحدث
      </button>
      <button class="seg-btn" type="button" data-sort="oldest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        الأقدم
      </button>
    </div>
  </div>

  <!-- فلتر الحالة -->
  <div class="filter-row">
    <div class="segmented" id="statusFilter">
      <button class="seg-btn active" type="button" data-status="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg>
        الطلبات النشطة <span class="count">14</span>
      </button>
      <button class="seg-btn" type="button" data-status="done">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
        الطلبات المنفذة <span class="count">39</span>
      </button>
    </div>
  </div>

  <div class="orders" id="ordersList"></div>
</main>

<script>
  // بيانات تجريبية — استبدلها بمصدر البيانات الحقيقي عندك
  const ORDERS = [
    { id: 1041, customer: "مؤسسة النخبة",   type: "clothes", status: "active", createdAt: "2026-08-12" },
    { id: 1039, customer: "أحمد الزهراني",  type: "other",   status: "active", createdAt: "2026-08-10" },
    { id: 1035, customer: "متجر الواحة",    type: "clothes", status: "active", createdAt: "2026-08-04" },
    { id: 1028, customer: "شركة الأفق",     type: "other",   status: "done",   createdAt: "2026-07-27" },
    { id: 1022, customer: "نادي الرواد",    type: "clothes", status: "active", createdAt: "2026-07-19" },
    { id: 1014, customer: "سالم القحطاني",  type: "clothes", status: "done",   createdAt: "2026-07-02" }
  ];

  const state = { type: "all", sort: "newest", status: "active" };

  const TYPE_LABEL   = { clothes: "ملابس", other: "منتج آخر" };
  const STATUS_LABEL = { active: "نشط", done: "منفذ" };

  function bindSegment(containerId, key) {
    const container = document.getElementById(containerId);
    container.addEventListener("click", (e) => {
      const btn = e.target.closest(".seg-btn");
      if (!btn) return;
      container.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[key] = btn.dataset[key];
      render();
    });
  }

  function render() {
    const list = ORDERS
      .filter(o => state.type === "all" || o.type === state.type)
      .filter(o => o.status === state.status)
      .sort((a, b) => state.sort === "newest"
        ? new Date(b.createdAt) - new Date(a.createdAt)   // الأحدث أولاً
        : new Date(a.createdAt) - new Date(b.createdAt)); // الأقدم أولاً

    const el = document.getElementById("ordersList");

    if (!list.length) {
      el.innerHTML = '<div class="order"><span class="sub">لا توجد طلبات مطابقة</span></div>';
      return;
    }

    el.innerHTML = list.map(o => `
      <div class="order">
        <div class="meta">
          <span class="name">${o.customer}</span>
          <span class="sub">طلب رقم #${o.id} — ${TYPE_LABEL[o.type]} — ${STATUS_LABEL[o.status]}</span>
        </div>
        <span class="date">${o.createdAt}</span>
      </div>
    `).join("");
  }

  bindSegment("typeFilter", "type");
  bindSegment("sortFilter", "sort");
  bindSegment("statusFilter", "status");
  render();
</script>

</body>
</html>
