name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/edit-and-push-lt71oc
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# اسمح بنشر واحد في نفس الوقت، وألغِ عمليات النشر القديمة قيد الانتظار
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # يتطلب تفعيل Pages مسبقاً من:
      # Settings > Pages > Source = GitHub Actions
      # (التوكن الافتراضي لا يملك صلاحية إنشاء موقع Pages تلقائياً)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # الموقع ملفات ثابتة في جذر المستودع — لا يوجد خطوة بناء
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
